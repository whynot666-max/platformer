<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Platformer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
    height: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #info {
    margin-bottom: 12px;
    font-size: 14px;
    opacity: 0.85;
    text-align: center;
    padding: 0 12px;
  }
  #game-wrap {
    position: relative;
    max-width: 100vw;
    max-height: 100vh;
  }
  canvas {
    display: block;
    background: #87ceeb;
    border: 3px solid #333;
    border-radius: 6px;
    image-rendering: pixelated;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    width: min(calc(100vw - 24px), calc((100vh - 80px) * 1.6));
    height: auto;
    aspect-ratio: 800 / 500;
  }

  /* Touch controls — hidden by default, shown on touch devices */
  .touch-pad {
    position: absolute;
    bottom: 4%;
    display: none;
    gap: 12px;
    z-index: 10;
    pointer-events: auto;
  }
  .touch-pad-left  { left: 3%;  }
  .touch-pad-right { right: 3%; }
  .touch-btn {
    width: clamp(48px, 9vmin, 80px);
    height: clamp(48px, 9vmin, 80px);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 3px solid rgba(255, 255, 255, 0.55);
    color: white;
    font-size: clamp(11px, 1.8vmin, 16px);
    font-weight: 800;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    padding: 0;
  }
  .touch-btn.dash { background: rgba(126, 203, 255, 0.35); border-color: rgba(126, 203, 255, 0.8); }
  .touch-btn.jump { background: rgba(255, 204, 68, 0.35);  border-color: rgba(255, 204, 68, 0.8); }
  .touch-btn:active { transform: scale(0.92); filter: brightness(1.4); }

  @media (hover: none) and (pointer: coarse) {
    #info { display: none; }
    .touch-pad { display: flex; }
    body { padding: 0; }
    canvas { width: 100vw; max-height: 100vh; }
  }
</style>
</head>
<body>
<div id="info">walk: <b>A / D</b> or <b>← →</b> &nbsp;·&nbsp; jump: <b>W</b>, <b>Space</b>, or <b>↑</b> &nbsp;·&nbsp; dash: <b>J</b> or <b>Shift</b> &nbsp;·&nbsp; pause: <b>Esc</b> or <b>P</b> &nbsp;·&nbsp; mute: <b>M</b> &nbsp;·&nbsp; restart: <b>R</b></div>
<div id="game-wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div class="touch-pad touch-pad-left">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>
  <div class="touch-pad touch-pad-right">
    <button class="touch-btn dash" id="btn-dash">DASH</button>
    <button class="touch-btn jump" id="btn-jump">JUMP</button>
  </div>
</div>

// ─────────── Audio (synthesized via Web Audio API; no files) ───────────
const MUTE_KEY = 'platformer.muted';
let muted = (() => {
  try { return localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { return false; }
})();

const audio = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function play({ freq = 440, type = 'square', dur = 0.1, vol = 0.2,
                  sweep = 0, sweepTo = null, attack = 0.005 }) {
    if (muted) return;
    const c = getCtx();
    if (!c) return;
    try {
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      const target = sweepTo !== null ? sweepTo : (freq + sweep);
      if (target !== freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, target), t0 + dur);
      }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* never crash gameplay because of audio */ }
  }

  function chord(notes, dur = 0.18, vol = 0.16) {
    notes.forEach((n, i) => setTimeout(() => play({ freq: n, type: 'square', dur, vol }), i * 90));
  }

  return {
    jump:     () => play({ freq: 480, type: 'square',   dur: 0.08, vol: 0.14, sweep: 220 }),
    dash:     () => play({ freq: 720, type: 'sawtooth', dur: 0.09, vol: 0.16, sweep: 400 }),
    super:    () => play({ freq: 900, type: 'sawtooth', dur: 0.16, vol: 0.20, sweep: 700 }),
    stunHit:  () => play({ freq: 240, type: 'square',   dur: 0.13, vol: 0.22, sweepTo: 90 }),
    hurt:     () => play({ freq: 220, type: 'sawtooth', dur: 0.22, vol: 0.25, sweepTo: 80 }),
    die:      () => chord([392, 330, 262, 196], 0.18, 0.22),
    bossHit:  () => { play({ freq: 160, type: 'square', dur: 0.22, vol: 0.28, sweepTo: 70 });
                      setTimeout(() => play({ freq: 90, type: 'sawtooth', dur: 0.15, vol: 0.2, sweepTo: 40 }), 60); },
    bossShot: () => play({ freq: 1100, type: 'square',  dur: 0.05, vol: 0.10, sweepTo: 500 }),
    winLevel: () => chord([523, 659, 784], 0.18, 0.20),
    winGame:  () => chord([523, 659, 784, 1047], 0.22, 0.22),
  };
})();

function toggleMute() {
  muted = !muted;

const keys = {};
let jumpQueued = false;
let dashQueued = false;
let advanceQueued = false;

// We key inputs by e.code (the physical key location), not e.key (the language-
// dependent character). KeyA on a Hebrew layout is still "KeyA" even though
// it physically prints ש. Means controls work regardless of input language.
window.addEventListener('keydown', (e) => {
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(c)) {
    e.preventDefault();
  }
  if (!keys[c]) {
    // Globally available — mute + Konami work on every screen
    if (c === 'KeyM') toggleMute();
    konamiBuf.push(c);
    if (konamiBuf.length > KONAMI_SEQ.length) konamiBuf.shift();
    if (!konamiUnlocked
        && konamiBuf.length === KONAMI_SEQ.length
        && KONAMI_SEQ.every((k, i) => konamiBuf[i] === k)) {
      konamiUnlocked = true;
      try { localStorage.setItem(KONAMI_KEY, '1'); } catch (e) {}
      konamiNotifyTimer = 240;
      audio.winLevel();
    }

    if (gameState === 'playing') {
      if (c === 'KeyW' || c === 'Space' || c === 'ArrowUp') jumpQueued = true;
      if (c === 'KeyJ' || c === 'ShiftLeft' || c === 'ShiftRight') dashQueued = true;
      if (c === 'Space' || c === 'Enter') advanceQueued = true;
      if (c === 'KeyR') loadLevel(currentLevel);
      if (c === 'Escape' || c === 'KeyP') { gameState = 'paused'; pauseCursor = 0; }
      // Dev shortcuts still work in-game
      if (c.startsWith('Digit') && c !== 'Digit0') {
        const idx = parseInt(c.slice(5), 10) - 1;
        if (idx < LEVELS.length) loadLevel(idx);
      }
      if (c === 'Digit0' && 9 < LEVELS.length) loadLevel(9);
      if (c === 'BracketRight' || c === 'Equal')
        loadLevel(Math.min(LEVELS.length - 1, currentLevel + 1));
      if (c === 'BracketLeft' || c === 'Minus')
        loadLevel(Math.max(0, currentLevel - 1));
    } else if (gameState === 'paused') {
      if (c === 'Escape' || c === 'KeyP') gameState = 'playing';
      if (c === 'ArrowUp')   pauseCursor = (pauseCursor + PAUSE_OPTIONS.length - 1) % PAUSE_OPTIONS.length;
      if (c === 'ArrowDown') pauseCursor = (pauseCursor + 1) % PAUSE_OPTIONS.length;
      if (c === 'Enter' || c === 'Space') PAUSE_OPTIONS[pauseCursor].action();
    } else if (gameState === 'menu') {
      if (c === 'ArrowUp')   menuCursor = (menuCursor + MENU_OPTIONS.length - 1) % MENU_OPTIONS.length;
      if (c === 'ArrowDown') menuCursor = (menuCursor + 1) % MENU_OPTIONS.length;
      if (c === 'Enter' || c === 'Space') MENU_OPTIONS[menuCursor].action();
    } else if (gameState === 'levelSelect') {
      if (c === 'Escape') gameState = 'menu';
      if (c === 'ArrowLeft')  selectCursor = Math.max(0, selectCursor - 1);
      if (c === 'ArrowRight') selectCursor = Math.min(LEVELS.length - 1, selectCursor + 1);
      if (c === 'ArrowUp')    selectCursor = Math.max(0, selectCursor - LEVEL_SELECT_COLS);
      if (c === 'ArrowDown')  selectCursor = Math.min(LEVELS.length - 1, selectCursor + LEVEL_SELECT_COLS);
      if (c === 'Enter' || c === 'Space') { loadLevel(selectCursor); gameState = 'playing'; }
    }
  }
  keys[c] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Canvas mouse / touch — translate page coords into the 800x500 canvas space
function canvasPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width  / rect.width),
    y: (clientY - rect.top)  * (canvas.height / rect.height),
  };
}
canvas.addEventListener('mousemove', (e) => {
  const p = canvasPoint(e.clientX, e.clientY);
  mouseX = p.x; mouseY = p.y;
});
canvas.addEventListener('mousedown', (e) => {
  if (gameState === 'playing') return; // game uses keyboard/touch buttons
  const p = canvasPoint(e.clientX, e.clientY);
  mouseX = p.x; mouseY = p.y;
  clickQueued = true;
});
canvas.addEventListener('touchstart', (e) => {
  if (gameState === 'playing') return;
  const t = e.touches[0]; if (!t) return;
  const p = canvasPoint(t.clientX, t.clientY);
  mouseX = p.x; mouseY = p.y;
  clickQueued = true;
  e.preventDefault();
}, { passive: false });

const LEVEL_SELECT_COLS = 5;
const LEVEL_SELECT_ROWS = 6;

const MENU_OPTIONS = [
  { label: 'PLAY',         action: () => { loadLevel(loadSavedLevel()); gameState = 'playing'; } },
  { label: 'LEVEL SELECT', action: () => { gameState = 'levelSelect'; selectCursor = currentLevel; } },
  { label: 'MUTE: OFF',    dyn: () => 'MUTE: ' + (muted ? 'ON' : 'OFF'),
                            action: () => { toggleMute(); } },
];

const PAUSE_OPTIONS = [
  { label: 'RESUME',        action: () => { gameState = 'playing'; } },
  { label: 'RESTART LEVEL', action: () => { loadLevel(currentLevel); gameState = 'playing'; } },
  { label: 'LEVEL SELECT',  action: () => { gameState = 'levelSelect'; selectCursor = currentLevel; } },
  { label: 'MAIN MENU',     action: () => { gameState = 'menu'; menuCursor = 0; } },
  { label: 'MUTE: ON',      dyn: () => 'MUTE: ' + (muted ? 'OFF' : 'ON'),
                             action: () => { toggleMute(); } },
];

// Process any pending click: walk the clickables registered by the most recent
// screen draw and fire the first match.
function consumeClick() {
  if (!clickQueued) return;
  clickQueued = false;
  for (const c of clickables) {
    if (mouseX >= c.x && mouseX <= c.x + c.w &&
        mouseY >= c.y && mouseY <= c.y + c.h) {
      c.action();
      return;
    }
  }
}

// Generic vertical menu rendering (used by main menu + pause)
function drawVerticalMenu(title, options, cursor, setCursor, subtitle) {
  clickables = [];
  // Dim background
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffdd33';
  ctx.font = '800 44px -apple-system, sans-serif';
  ctx.fillText(title, W / 2, 110);

  if (subtitle) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '500 14px -apple-system, sans-serif';
    ctx.fillText(subtitle, W / 2, 138);
  }

  const btnW = 280, btnH = 44, gap = 12;
  const startY = 180;
  for (let i = 0; i < options.length; i++) {
    const x = (W - btnW) / 2;
    const y = startY + i * (btnH + gap);
    const hovered = mouseX >= x && mouseX <= x + btnW && mouseY >= y && mouseY <= y + btnH;
    if (hovered) setCursor(i);
    const selected = i === cursor;
    // Button bg
    ctx.fillStyle = selected ? 'rgba(255, 221, 51, 0.25)' : 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect(x, y, btnW, btnH);
    // Border
    ctx.fillStyle = selected ? '#ffdd33' : 'rgba(255,255,255,0.35)';
    ctx.fillRect(x, y, btnW, 2);
    ctx.fillRect(x, y + btnH - 2, btnW, 2);
    ctx.fillRect(x, y, 2, btnH);
    ctx.fillRect(x + btnW - 2, y, 2, btnH);
    // Label
    ctx.fillStyle = selected ? '#ffdd33' : '#fff';
    ctx.font = '700 18px -apple-system, sans-serif';
    const label = options[i].dyn ? options[i].dyn() : options[i].label;
    ctx.fillText(label, W / 2, y + btnH / 2 + 6);

    clickables.push({ x, y, w: btnW, h: btnH, action: options[i].action });
  }

  // Hint footer
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '500 12px -apple-system, sans-serif';
  ctx.fillText('↑ ↓ to move · Enter to select · click also works', W / 2, H - 22);
  ctx.textAlign = 'left';
}

function drawMainMenu() {
  // Background — a gentle starfield so it's not pure black
  ctx.fillStyle = '#0e0b22';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137 + 23) % W;
    const sy = (i * 211 + 17) % H;
    const tw = (performance.now() / 500 + i * 0.3);
    const a = 0.3 + 0.5 * ((Math.sin(tw) + 1) / 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
    ctx.fillRect(sx, sy, 2, 2);
  }
  drawVerticalMenu('PLATFORMER', MENU_OPTIONS, menuCursor, (i) => menuCursor = i,
    'dash · stun · ride');
}

function drawPauseMenu() {
  // Draw the underlying game frame first, dimmed
  drawGameFrame();
  drawVerticalMenu('PAUSED', PAUSE_OPTIONS, pauseCursor, (i) => pauseCursor = i,
    levelName);
}

function drawLevelSelect() {
  // Background — themed to currently selected level
  const lv = LEVELS[selectCursor];
  const savedTheme = currentTheme;
  currentTheme = lv.theme || 'field';
  drawSky();
  currentTheme = savedTheme;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  clickables = [];
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffdd33';
  ctx.font = '800 32px -apple-system, sans-serif';
  ctx.fillText('LEVEL SELECT', W / 2, 50);

  // Grid
  const cellW = 80, cellH = 50, gapX = 12, gapY = 12;
  const gridW = LEVEL_SELECT_COLS * cellW + (LEVEL_SELECT_COLS - 1) * gapX;
  const gridH = LEVEL_SELECT_ROWS * cellH + (LEVEL_SELECT_ROWS - 1) * gapY;
  const startX = (W - gridW) / 2;
  const startY = 78;

  for (let i = 0; i < LEVELS.length; i++) {
    const row = Math.floor(i / LEVEL_SELECT_COLS);
    const col = i % LEVEL_SELECT_COLS;
    const x = startX + col * (cellW + gapX);
    const y = startY + row * (cellH + gapY);
    const lvi = LEVELS[i];
    const isBoss = !!lvi.boss;
    const hovered = mouseX >= x && mouseX <= x + cellW && mouseY >= y && mouseY <= y + cellH;
    if (hovered) selectCursor = i;
    const selected = i === selectCursor;

    ctx.fillStyle = selected ? 'rgba(255, 221, 51, 0.25)'
                  : isBoss ? 'rgba(180, 40, 40, 0.30)'
                  : 'rgba(255, 255, 255, 0.10)';
    ctx.fillRect(x, y, cellW, cellH);
    ctx.fillStyle = selected ? '#ffdd33'
                   : isBoss  ? '#ff6644'
                   : 'rgba(255,255,255,0.45)';
    ctx.fillRect(x, y, cellW, 2);
    ctx.fillRect(x, y + cellH - 2, cellW, 2);
    ctx.fillRect(x, y, 2, cellH);
    ctx.fillRect(x + cellW - 2, y, 2, cellH);
    // Number
    ctx.fillStyle = selected ? '#ffdd33' : '#fff';
    ctx.font = '800 18px -apple-system, sans-serif';
    ctx.fillText(String(i + 1), x + cellW / 2, y + 22);
    // Name (smaller)
    ctx.font = '600 10px -apple-system, sans-serif';
    ctx.fillStyle = selected ? '#ffdd33' : 'rgba(255,255,255,0.7)';
    ctx.fillText(lvi.name, x + cellW / 2, y + 38);

    clickables.push({
      x, y, w: cellW, h: cellH,
      action: () => { selectCursor = i; loadLevel(i); gameState = 'playing'; },
    });
  }

  // Footer info
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '500 12px -apple-system, sans-serif';
  ctx.fillText('arrows + Enter · or click a level · Esc to return', W / 2, H - 18);
  ctx.textAlign = 'left';
}

// Touch / mouse controls for mobile
function bindTouchButton(id, onPress, onRelease) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => { e.preventDefault(); onPress(); };
  const release = (e) => { e.preventDefault(); onRelease(); };
  el.addEventListener('touchstart', press,   { passive: false });
  el.addEventListener('touchend',   release, { passive: false });
  el.addEventListener('touchcancel',release, { passive: false });
  el.addEventListener('mousedown',  press);
  el.addEventListener('mouseup',    release);
  el.addEventListener('mouseleave', release);
}

bindTouchButton('btn-left',
  () => { keys['KeyA'] = true; },
  () => { keys['KeyA'] = false; });
bindTouchButton('btn-right',
  () => { keys['KeyD'] = true; },
  () => { keys['KeyD'] = false; });
bindTouchButton('btn-jump',
  () => { jumpQueued = true; advanceQueued = true; keys['KeyW'] = true; },
  () => { keys['KeyW'] = false; });
bindTouchButton('btn-dash',
  () => { dashQueued = true; keys['KeyJ'] = true; },
  () => { keys['KeyJ'] = false; });

const SAVE_KEY = 'platformer.currentLevel';

function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, String(currentLevel)); } catch (e) {}
}

function loadSavedLevel() {
  try {
    const v = localStorage.getItem(SAVE_KEY);
    const n = parseInt(v, 10);
    if (!isNaN(n) && n >= 0 && n < LEVELS.length) return n;
  } catch (e) {}
  return 0;
}

function loadLevel(idx) {
  const lv = LEVELS[idx];
  currentLevel = idx;
  levelName = lv.name;
  saveProgress();
  spawn = { x: lv.spawn.x, y: lv.spawn.y };
  // Deep-copy platforms and bots so we don't mutate the level definition
  platforms = lv.platforms.map((p) => ({ ...p }));
  bots = lv.bots.map((b) => ({ ...b, stunTimer: 0 }));
  goal = lv.goal ? { ...lv.goal } : null;
  // Every level shows FLAG IS WIN by default; levels can override the position.
  babaRule = lv.babaRule ? { ...lv.babaRule } : { x: 310, y: 70 };
  currentTheme = lv.theme || 'field';
  projectiles = [];
  boss = lv.boss ? {
    ...lv.boss,
    maxHp: lv.boss.hp,
    state: 'vulnerable',
    stateTimer: BOSS_VULN_FRAMES,
    projTimer: 0,
  } : null;
  levelComplete = false;
  levelCompleteTimer = 0;
  respawn();
}

function pressing(...names) {
  return names.some((n) => keys[n]);
}

function update() {
  if (levelComplete) {
    levelCompleteTimer++;
    if (advanceQueued && levelCompleteTimer > 30) {
      advanceQueued = false;
      const next = currentLevel + 1;
      if (next < LEVELS.length) {
        loadLevel(next);
      } else {
        // last level — restart from beginning for now
        loadLevel(0);
      }
    }
    advanceQueued = false;
    jumpQueued = false;
    dashQueued = false;
    return;
  }

  const left  = pressing('KeyA', 'ArrowLeft');
  const right = pressing('KeyD', 'ArrowRight');

  const dashing = player.dashTimer > 0;

  if (!dashing) {
    if (left)  { player.vx -= MOVE_ACCEL; player.facing = -1; }
    if (right) { player.vx += MOVE_ACCEL; player.facing =  1; }

    player.vx *= FRICTION;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
    // Speed cap is relaxed while super-boost is active, so you keep your dash speed for a beat
    if (player.superBoost <= 0) {
      player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));
    } else {
      player.vx = Math.max(-DASH_SPEED, Math.min(DASH_SPEED, player.vx));
    }
  }

  if (jumpQueued) {
    // Super requires the dash to have started on the ground, UNLESS the player
    // has unlocked midair super via the Konami code.
    const superAllowed = dashing && (player.dashFromGround || konamiUnlocked);
    if (superAllowed) {
      player.dashTimer = 0;
      player.vy = -JUMP_POWER;
      player.vx = DASH_SPEED * player.dashDir;
      player.superBoost = SUPER_BOOST_FRAMES;
      player.onGround = false;
      audio.super();
    } else if (player.onGround) {
      player.vy = -JUMP_POWER;
      player.onGround = false;
      audio.jump();
    }
  }
  jumpQueued = false;

  if (player.superBoost > 0) player.superBoost--;

  if (dashQueued && player.dashCooldown <= 0) {
    player.dashTimer = DASH_DURATION;
    player.dashCooldown = DASH_COOLDOWN;
    player.dashDir = player.facing;
    player.dashFromGround = player.onGround;
    player.vy = 0;
    audio.dash();
  }
  dashQueued = false;

  if (player.dashTimer > 0) {
    player.vx = DASH_SPEED * player.dashDir;
    player.vy = 0;
    player.dashTimer--;
  } else {
    player.vy += GRAVITY;
  }
  if (player.dashCooldown > 0) player.dashCooldown--;

  player.x += player.vx;
  resolveX();
  player.y += player.vy;
  player.onGround = false;
  resolveY();

  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > W) { player.x = W - player.w; player.vx = 0; }
  if (player.y > H + 200) {
    // Falling off = death. Mark hearts to 0 so the deferred death check at the
    // end of update() handles the actual world-reset cleanly.
    player.hearts = 0;
  }

  updateBots();
  handleBotCollisions();
  updateBoss();
  handleBossCollision();
  updateProjectiles();

  if (player.invulnTimer > 0) player.invulnTimer--;

  if (goal && overlap(player, goal)) {
    if (!levelComplete) {
      audio.winLevel();
    }
    levelComplete = true;
    levelCompleteTimer = 0;
    advanceQueued = false;
  }

  // Deferred death: handle at the end of the tick so nothing mutates state
  // (clears projectiles, switches level) while another loop is iterating.
  if (player.hearts <= 0) die();
}

function updateBots() {
  for (const b of bots) {
    if (b.stunTimer > 0) {
      b.stunTimer--;
      continue;
    }

    if (b.type === 'sentry') {
      b.shootTimer--;
      if (b.shootTimer <= 0) {
        spawnEnemyProjectile(b);
        b.shootTimer = b.shootInterval;
      }
      continue;
    }

    if (b.type === 'charger') {
      // Same-floor detection: both feet at the same y means same surface
      const sameY = Math.abs((player.y + player.h) - (b.y + b.h)) < 5;
      const dist  = Math.abs((player.x + player.w / 2) - (b.x + b.w / 2));
      if (sameY && dist < 250) {
        b.charging = true;
        b.vx = (player.x > b.x ? 1 : -1) * b.chargeSpeed;
      } else if (!sameY || dist > 350) {
        b.charging = false;
        if (Math.abs(b.vx) > b.speed) b.vx = Math.sign(b.vx) * b.speed || b.speed;
      }
      b.x += b.vx;
      if (b.x < b.patrolMin)       { b.x = b.patrolMin;       b.vx =  Math.abs(b.vx); }
      if (b.x + b.w > b.patrolMax) { b.x = b.patrolMax - b.w; b.vx = -Math.abs(b.vx); }
      continue;
    }

    // sprout / floater: simple horizontal patrol
    b.x += b.vx;
    if (b.x < b.patrolMin)         { b.x = b.patrolMin;          b.vx =  b.speed; }
    if (b.x + b.w > b.patrolMax)   { b.x = b.patrolMax - b.w;    b.vx = -b.speed; }
  }
}

function spawnEnemyProjectile(b) {
  const dir = (player.x + player.w / 2) > (b.x + b.w / 2) ? 1 : -1;
  projectiles.push({
    x: dir > 0 ? b.x + b.w : b.x - 10,
    y: b.y + b.h / 2 - 4,
    w: 10, h: 8,
    vx: dir * 4.5,
    enemy: true,
  });
  audio.bossShot();
}

function handleBotCollisions() {
  const dashing = player.dashTimer > 0;
  const supering = player.superBoost > 0;

  // Dashing OR supering into an un-stunned bot stuns it.
  // Plain dash also auto-mounts the player on top. A super preserves trajectory.
  if (dashing || supering) {
    for (const b of bots) {
      if (b.stunTimer > 0) continue;
      if (overlap(player, b)) {
        b.stunTimer = STUN_DURATION;
        b.vx = 0;
        if (dashing) {
          // auto-mount: snap onto bot's top
          player.y = b.y - player.h;
          player.vy = 0;
          player.vx = 0;
          player.dashTimer = 0;
          player.onGround = true;
        }
        audio.stunHit();
        return;
      }
    }
  }

  // Touching an un-stunned bot (not attacking, not invulnerable) hurts.
  if (dashing || supering) return;
  if (player.invulnTimer > 0) return;
  for (const b of bots) {
    if (b.stunTimer > 0) continue;
    if (overlap(player, b)) {
      hurtPlayer(b);
      return;
    }
  }
}

function hurtPlayer(source) {
  player.hearts--;
  player.invulnTimer = INVULN_FRAMES;
  const dir = (player.x + player.w / 2) < (source.x + source.w / 2) ? -1 : 1;
  player.vx = HURT_KNOCKBACK_X * dir;
  player.vy = HURT_KNOCKBACK_Y;
  if (player.hearts > 0) audio.hurt();
  // Death sound is played from die() itself.
  // Don't respawn here — it would clear projectiles[] mid-iteration upstream.
  // The respawn check happens at the end of update().
}

function respawn() {
  player.x = spawn.x;
  player.y = spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.dashTimer = 0;
  player.dashCooldown = 0;
  player.dashFromGround = false;
  player.superBoost = 0;
  player.hearts = MAX_HEARTS;
  player.invulnTimer = 0;
  player.facing = 1;

  // Reset boss + clear projectiles
  projectiles = [];
  if (boss) {
    const lvDef = LEVELS[currentLevel];
    if (lvDef.boss) {
      boss.hp = lvDef.boss.hp;
      boss.state = 'vulnerable';
      boss.stateTimer = BOSS_VULN_FRAMES;
      boss.projTimer = 0;
    }
  }
}

// Death sends you back to the FIRST level of the current world (worlds are 3 levels each)
function die() {
  audio.die();
  const worldFirst = Math.floor(currentLevel / 3) * 3;
  loadLevel(worldFirst);
}

function getSolids() {
  const solids = platforms.slice();
  for (const b of bots) if (b.stunTimer > 0) solids.push(b);
  if (boss && boss.state === 'stunned') solids.push(boss);
  return solids;
}

function bossTiming(boss) {
  // Final boss: shorter vulnerable window, longer & denser attacks, faster telegraph
  if (boss && boss.isFinal) {
    return {
      vuln: 120,       // 2.0s (was 3.0s)
      tele: 35,        // 0.58s (was 0.83s)
      atk:  180,       // 3.0s (was 2.0s)
      projInterval: 14,// every 0.23s (was 0.33s) — ~13 projectiles per barrage
    };
  }
  return {
    vuln: BOSS_VULN_FRAMES,
    tele: BOSS_TELE_FRAMES,
    atk:  BOSS_ATK_FRAMES,
    projInterval: BOSS_PROJ_INTERVAL,
  };
}

function updateBoss() {
  if (!boss || boss.state === 'defeated') return;
  boss.stateTimer--;
  const tim = bossTiming(boss);

  if (boss.state === 'attacking') {
    boss.projTimer--;
    if (boss.projTimer <= 0) {
      spawnBossProjectile();
      boss.projTimer = tim.projInterval;
    }
  }

  if (boss.stateTimer <= 0) {
    switch (boss.state) {
      case 'vulnerable':
        boss.state = 'telegraph';
        boss.stateTimer = tim.tele;
        break;
      case 'telegraph':
        boss.state = 'attacking';
        boss.stateTimer = tim.atk;
        boss.projTimer = 0;
        break;
      case 'attacking':
        boss.state = 'vulnerable';
        boss.stateTimer = tim.vuln;
        break;
    }
  }
}

function spawnBossProjectile() {
  if (!boss) return;
  const dir = (player.x + player.w / 2) > (boss.x + boss.w / 2) ? 1 : -1;
  const speed = boss.isFinal ? BOSS_PROJ_SPEED + 1 : BOSS_PROJ_SPEED;
  projectiles.push({
    x: dir > 0 ? boss.x + boss.w : boss.x - 14,
    y: boss.y + boss.h - 30,
    w: 14, h: 10,
    vx: dir * speed,
  });
  // Final boss also fires the OPPOSITE direction so you can't just hide behind it
  if (boss.isFinal) {
    projectiles.push({
      x: dir > 0 ? boss.x - 14 : boss.x + boss.w,
      y: boss.y + boss.h - 30,
      w: 14, h: 10,
      vx: -dir * speed,
    });
  }
  audio.bossShot();
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    if (p.x < -30 || p.x > W + 30) {
      projectiles.splice(i, 1);
      continue;
    }
    const phasing = player.dashTimer > 0 || player.superBoost > 0;
    if (player.invulnTimer <= 0 && !phasing && overlap(player, p)) {
      hurtPlayer(p);
      projectiles.splice(i, 1);
    }
  }
}

function handleBossCollision() {
  if (!boss || boss.state === 'defeated') return;

  // Both regular dash AND a super (the post-dash-cancel boost window) count
  // as an attacking state for damaging the boss.
  const attacking = player.dashTimer > 0 || player.superBoost > 0;

  if (attacking && boss.state === 'vulnerable' && overlap(player, boss)) {
    boss.hp--;
    audio.bossHit();

    if (player.dashTimer > 0) {
      // Plain dash hit: knock the player back opposite the dash direction.
      const dir = -player.dashDir;
      player.vx = 11 * dir;
      player.vy = -9;
      player.dashTimer = 0;
      player.superBoost = SUPER_BOOST_FRAMES;
    }
    // For a super hit we don't touch the player's velocity — they keep
    // soaring along their super trajectory.
    player.invulnTimer = 12; // tiny i-frames to clear the boss hitbox cleanly

    if (boss.hp <= 0) {
      boss.state = 'defeated';
      levelComplete = true;
      levelCompleteTimer = 0;
      advanceQueued = false;
      (boss.isFinal ? audio.winGame : audio.winLevel)();
    } else {
      // No freeze — boss immediately winds up an attack (timing depends on boss type)
      boss.state = 'telegraph';
      boss.stateTimer = bossTiming(boss).tele;
    }
    return;
  }

  // Touching the boss in any non-defeated state hurts. Dash and super both
  // phase through (since they are attacks).
  if (attacking) return;
  if (player.invulnTimer > 0) return;
  if (overlap(player, boss)) {
    hurtPlayer(boss);
  }
}

function resolveX() {
  for (const p of getSolids()) {
    if (overlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
      player.dashTimer = 0;
    }
  }
}

function resolveY() {
  for (const p of getSolids()) {
    if (overlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

const THEME_SKY = {
  field:   ['#87ceeb', '#cfeaff'],
  factory: ['#2a2735', '#5a4f60'],
  cave:    ['#1a1216', '#3a2826'],
  sky:     ['#bce0ff', '#ffffff'],
  volcano: ['#1a0808', '#6a1a0a'],
  ice:     ['#a8d8e8', '#e8f8ff'],
  desert:  ['#f4c860', '#f4a060'],
  forest:  ['#1f3320', '#395538'],
  ocean:   ['#062a48', '#1a5878'],
  cosmic:  ['#08001a', '#2c0a4a'],
};

function drawSky() {
  const colors = THEME_SKY[currentTheme] || THEME_SKY.field;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, colors[0]);
  grad.addColorStop(1, colors[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (currentTheme === 'factory') {
    ctx.fillStyle = 'rgba(180, 170, 200, 0.18)';
    for (let i = 0; i < 5; i++) ctx.fillRect(60 + i * 170, 0, 8, H);
    for (let i = 0; i < W; i += 24) {
      ctx.fillStyle = (Math.floor(i / 24) % 2) ? '#3a2a18' : '#a07020';
      ctx.fillRect(i, 0, 24, 6);
    }
  } else if (currentTheme === 'cave') {
    // dim stalactites
    ctx.fillStyle = '#221816';
    for (let i = 0; i < 8; i++) {
      const x = 40 + i * 100;
      ctx.fillRect(x, 0, 14, 22 + (i * 37) % 28);
      ctx.fillRect(x + 4, 22, 6, 12);
    }
    // sparse glow dots
    ctx.fillStyle = 'rgba(255, 200, 120, 0.55)';
    for (let i = 0; i < 6; i++) {
      const sx = (i * 211 + 53) % W;
      const sy = 40 + (i * 137 + 23) % 200;
      ctx.fillRect(sx, sy, 2, 2);
    }
  } else if (currentTheme === 'sky') {
    // soft clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    for (let i = 0; i < 5; i++) {
      const cx = 80 + i * 160;
      const cy = 60 + (i % 2) * 70;
      ctx.fillRect(cx, cy, 80, 18);
      ctx.fillRect(cx + 12, cy - 8, 56, 8);
      ctx.fillRect(cx + 8, cy + 18, 64, 6);
    }
  } else if (currentTheme === 'volcano') {
    // ember particles
    const t = performance.now() / 80;
    ctx.fillStyle = 'rgba(255, 180, 80, 0.6)';
    for (let i = 0; i < 18; i++) {
      const ex = (i * 67 + 23) % W;
      const ey = (H - ((t * (0.5 + (i % 4) * 0.2)) + (i * 91)) % H);
      ctx.fillRect(ex, ey, 2, 2);
    }
    // back lava silhouette
    ctx.fillStyle = 'rgba(140, 30, 10, 0.5)';
    for (let i = 0; i < W; i += 30) {
      const h = 30 + ((i * 13) % 25);
      ctx.fillRect(i, H - 60 - h, 30, h);
    }
  } else if (currentTheme === 'ice') {
    // snow
    const t = performance.now() / 30;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    for (let i = 0; i < 30; i++) {
      const sx = (i * 53 + (t * 0.5)) % W;
      const sy = ((i * 91) + t) % H;
      ctx.fillRect(sx, sy, 2, 2);
    }
  } else if (currentTheme === 'desert') {
    // distant dunes
    ctx.fillStyle = 'rgba(200, 130, 50, 0.6)';
    for (let i = 0; i < W; i += 40) {
      const h = 35 + ((i * 17) % 30);
      ctx.fillRect(i, H - 80 - h, 40, h);
    }
    // sun
    ctx.fillStyle = 'rgba(255, 230, 130, 0.8)';
    ctx.fillRect(W - 100, 50, 40, 40);
    ctx.fillStyle = 'rgba(255, 230, 130, 0.3)';
    ctx.fillRect(W - 108, 58, 56, 24);
    ctx.fillRect(W - 96,  42, 32, 56);
  } else if (currentTheme === 'forest') {
    // tree silhouettes
    ctx.fillStyle = 'rgba(20, 30, 16, 0.8)';
    for (let i = 0; i < 7; i++) {
      const x = 30 + i * 115;
      ctx.fillRect(x, 60, 14, H - 60);
      ctx.fillRect(x - 30, 60, 74, 90);
      ctx.fillRect(x - 22, 40, 58, 60);
      ctx.fillRect(x - 10, 20, 34, 40);
    }
  } else if (currentTheme === 'ocean') {
    // bubbles
    const t = performance.now() / 50;
    ctx.fillStyle = 'rgba(180, 230, 255, 0.45)';
    for (let i = 0; i < 14; i++) {
      const bx = (i * 73 + 19) % W;
      const by = (H - ((t * (0.6 + (i % 3) * 0.3)) + i * 91) % H);
      const size = 3 + (i % 3);
      ctx.fillRect(bx, by, size, size);
    }
    // wavy light from above
    ctx.fillStyle = 'rgba(140, 200, 255, 0.18)';
    for (let i = 0; i < W; i += 40) {
      ctx.fillRect(i + Math.sin(t / 10 + i) * 4, 0, 12, 80);
    }
  } else if (currentTheme === 'cosmic') {
    // starfield
    for (let i = 0; i < 70; i++) {
      const sx = (i * 137 + 23) % W;
      const sy = (i * 211 + 17) % H;
      const tw = (performance.now() / 400 + i * 0.4);
      const a = 0.4 + 0.6 * ((Math.sin(tw) + 1) / 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      ctx.fillRect(sx, sy, 2, 2);
    }
    // distant nebula glow
    ctx.fillStyle = 'rgba(180, 80, 220, 0.18)';
    ctx.fillRect(160, 60, 220, 140);
    ctx.fillStyle = 'rgba(80, 180, 220, 0.14)';
    ctx.fillRect(420, 100, 240, 160);
  }
}

const THEME_PLAT = {
  field:   { body: '#4a7a2a', top: '#6da93b' },
  factory: { body: '#3a3a48', top: '#6a6a78' },
  cave:    { body: '#3a2a1a', top: '#6a4a30' },
  sky:     { body: '#dfe9f5', top: '#ffffff' },
  volcano: { body: '#2a0808', top: '#5a1a10' },
  ice:     { body: '#90c0d8', top: '#e0f0ff' },
  desert:  { body: '#a06030', top: '#d4a050' },
  forest:  { body: '#2a3a1a', top: '#4a7a2a' },
  ocean:   { body: '#1a4060', top: '#3a6a80' },
  cosmic:  { body: '#3a1060', top: '#7a4ac8' },
};

function drawPlatform(p) {
  const palette = THEME_PLAT[currentTheme] || THEME_PLAT.field;
  ctx.fillStyle = palette.body;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = palette.top;
  ctx.fillRect(p.x, p.y, p.w, 5);

  // theme-specific surface details
  if (currentTheme === 'factory') {
    ctx.fillStyle = '#aaaab8';
    for (let rx = p.x + 6; rx < p.x + p.w - 4; rx += 14) ctx.fillRect(rx, p.y + 1, 2, 2);
  } else if (currentTheme === 'volcano') {
    // lava cracks along the top
    ctx.fillStyle = '#ff6622';
    for (let rx = p.x + 4; rx < p.x + p.w - 4; rx += 12) {
      if ((rx + p.y) % 3 === 0) ctx.fillRect(rx, p.y + 1, 4, 2);
    }
  } else if (currentTheme === 'cave') {
    // sparse crystal dots
    ctx.fillStyle = '#aa66ff';
    for (let rx = p.x + 6; rx < p.x + p.w - 6; rx += 18) {
      if ((rx + p.y * 7) % 2 === 0) ctx.fillRect(rx, p.y + 2, 2, 2);
    }
  } else if (currentTheme === 'ice') {
    // frost speckle
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    for (let rx = p.x + 4; rx < p.x + p.w - 4; rx += 8) ctx.fillRect(rx, p.y + 1, 1, 1);
  } else if (currentTheme === 'desert') {
    // sand grains
    ctx.fillStyle = '#f4d080';
    for (let rx = p.x + 6; rx < p.x + p.w - 4; rx += 9) ctx.fillRect(rx, p.y + 2, 1, 1);
  } else if (currentTheme === 'forest') {
    // mossy patches
    ctx.fillStyle = '#5a8a3a';
    for (let rx = p.x + 4; rx < p.x + p.w - 4; rx += 11) ctx.fillRect(rx, p.y, 4, 2);
  } else if (currentTheme === 'cosmic') {
    // shimmer dots
    const t = performance.now() / 200;
    for (let rx = p.x + 6; rx < p.x + p.w - 4; rx += 12) {
      const a = 0.4 + 0.6 * ((Math.sin(t + rx * 0.2) + 1) / 2);
      ctx.fillStyle = `rgba(180, 120, 255, ${a})`;
      ctx.fillRect(rx, p.y + 1, 2, 2);
    }
  }
}

function drawPlayer() {
  const dashing = player.dashTimer > 0;
  const supering = player.superBoost > 0;
  const flashing = player.invulnTimer > 0 && Math.floor(player.invulnTimer / 4) % 2 === 0;
  if (flashing) return;

  if (dashing) {
    ctx.fillStyle = 'rgba(120, 200, 255, 0.35)';
    for (let i = 1; i <= 3; i++) {
      const tx = player.x - player.dashDir * i * 8;
      ctx.fillRect(tx, player.y, player.w, player.h);
    }
  } else if (supering) {
    // pink/magenta super trail
    const alpha = player.superBoost / SUPER_BOOST_FRAMES;
    ctx.fillStyle = `rgba(255, 120, 200, ${0.45 * alpha})`;
    const dir = player.vx >= 0 ? -1 : 1;
    for (let i = 1; i <= 3; i++) {
      ctx.fillRect(player.x + dir * i * 6, player.y, player.w, player.h);
    }
  }

  const bodyColor = dashing ? '#7ecbff' : (supering ? '#ffaadd' : '#ffcc44');
  const footColor = dashing ? '#3a8acc' : (supering ? '#cc4488' : '#cc8800');
  ctx.fillStyle = bodyColor;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.fillStyle = footColor;
  ctx.fillRect(player.x, player.y + player.h - 4, player.w, 4);

  ctx.fillStyle = '#000';
  const eyeOffset = player.facing === 1 ? player.w - 9 : 4;
  ctx.fillRect(player.x + eyeOffset, player.y + 10, 5, 5);

  if (player.dashCooldown > 0 && !dashing) {
    const pct = 1 - (player.dashCooldown / DASH_COOLDOWN);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(player.x, player.y - 8, player.w, 4);
    ctx.fillStyle = '#7ecbff';
    ctx.fillRect(player.x, player.y - 8, player.w * pct, 4);
  }
}

const WAKE_WARNING_FRAMES = 75; // last ~1.25s of stun = shake/flash

function drawSentryBot(b) {
  const stunned = b.stunTimer > 0;
  const wakingUp = stunned && b.stunTimer <= WAKE_WARNING_FRAMES;
  let shakeX = 0;
  if (wakingUp) shakeX = (Math.random() - 0.5) * (1 + (1 - b.stunTimer / WAKE_WARNING_FRAMES) * 3);
  const dx = b.x + shakeX;
  const dy = b.y;

  // bunker base
  ctx.fillStyle = stunned ? '#3a8acc' : '#403040';
  ctx.fillRect(dx, dy + 6, b.w, b.h - 6);
  ctx.fillStyle = stunned ? '#7ecbff' : '#604060';
  ctx.fillRect(dx + 2, dy + 8, b.w - 4, 4);
  // roof
  ctx.fillStyle = stunned ? '#3a8acc' : '#2a1a2a';
  ctx.fillRect(dx - 2, dy + 4, b.w + 4, 4);
  // big eye / barrel tracking player
  const eyeCx = dx + b.w / 2;
  const eyeCy = dy + 16;
  const dir = (player.x + player.w / 2) > eyeCx ? 1 : -1;
  ctx.fillStyle = '#1a0010';
  ctx.fillRect(eyeCx - 8, eyeCy - 4, 16, 8);
  if (!stunned) {
    // glowing pupil that tracks
    ctx.fillStyle = '#ff3344';
    ctx.fillRect(eyeCx - 4 + dir * 3, eyeCy - 3, 6, 6);
    // wind-up flash before shot (last 12 frames)
    if (b.shootTimer < 12) {
      const f = 1 - b.shootTimer / 12;
      ctx.fillStyle = `rgba(255, 220, 60, ${0.4 + f * 0.5})`;
      ctx.fillRect(eyeCx - 6 + dir * 4, eyeCy - 4, 4, 8);
    }
  } else {
    ctx.fillStyle = '#222';
    ctx.fillRect(eyeCx - 7, eyeCy - 1, 14, 2);
  }
  if (stunned) drawStunBar(b);
}

function drawChargerBot(b) {
  const stunned = b.stunTimer > 0;
  const wakingUp = stunned && b.stunTimer <= WAKE_WARNING_FRAMES;
  let shakeX = 0;
  if (wakingUp) shakeX = (Math.random() - 0.5) * (1 + (1 - b.stunTimer / WAKE_WARNING_FRAMES) * 3);
  const dx = b.x + shakeX;
  const dy = b.y;
  const charging = b.charging && !stunned;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(b.x + 2, b.y + b.h - 2, b.w - 4, 2);

  // motion blur trail when charging
  if (charging) {
    ctx.fillStyle = 'rgba(255, 80, 60, 0.3)';
    const back = b.vx > 0 ? -1 : 1;
    for (let i = 1; i <= 3; i++) ctx.fillRect(dx + back * i * 6, dy + 6, b.w, b.h - 6);
  }

  // chassis — red/orange when charging, gray otherwise
  ctx.fillStyle = stunned ? '#7ecbff' : (charging ? '#cc2810' : '#9a4a3a');
  ctx.fillRect(dx, dy + 6, b.w, b.h - 6);
  ctx.fillStyle = stunned ? '#3a8acc' : (charging ? '#8a1a08' : '#5a2a20');
  ctx.fillRect(dx, dy + b.h - 4, b.w, 4);

  // mohawk spikes on top — angled to direction
  ctx.fillStyle = stunned ? '#4a7a2a' : '#222';
  for (let i = 0; i < 5; i++) {
    const sx = dx + 4 + i * 5;
    ctx.fillRect(sx, dy + 1, 3, 6);
  }

  // eyes
  const facingRight = b.vx >= 0;
  if (stunned) {
    ctx.fillStyle = '#222';
    ctx.fillRect(dx + 6,  dy + 14, 5, 2);
    ctx.fillRect(dx + 18, dy + 14, 5, 2);
  } else {
    ctx.fillStyle = charging ? '#ffee44' : '#ff3344';
    const eyeY = dy + 12;
    if (facingRight) {
      ctx.fillRect(dx + b.w - 13, eyeY, 4, 5);
      ctx.fillRect(dx + b.w - 6,  eyeY, 4, 5);
    } else {
      ctx.fillRect(dx + 2, eyeY, 4, 5);
      ctx.fillRect(dx + 9, eyeY, 4, 5);
    }
  }

  if (stunned) drawStunBar(b);
}

function drawStunBar(b) {
  const wakingUp = b.stunTimer <= WAKE_WARNING_FRAMES;
  const pct = b.stunTimer / STUN_DURATION;
  const r = Math.floor(255 - 135 * pct);
  const g = Math.floor( 80 + 120 * pct);
  const bl = Math.floor( 80 + 175 * pct);
  const barY = wakingUp ? b.y - 22 : b.y - 7;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(b.x, barY, b.w, 4);
  ctx.fillStyle = `rgb(${r}, ${g}, ${bl})`;
  ctx.fillRect(b.x, barY, b.w * pct, 4);
}

function drawFloaterBot(b) {
  const stunned = b.stunTimer > 0;
  const wakingUp = stunned && b.stunTimer <= WAKE_WARNING_FRAMES;
  const t = performance.now() / 300;

  // Hover bob (visual only; collision uses fixed y)
  let bobY = stunned ? 0 : Math.sin(t + b.x * 0.01) * 2;
  let shakeX = 0, shakeY = 0;
  if (wakingUp) {
    const intensity = 1 + (1 - b.stunTimer / WAKE_WARNING_FRAMES) * 3;
    shakeX = (Math.random() - 0.5) * 2 * intensity;
    shakeY = (Math.random() - 0.5) * 1.5 * intensity;
  }
  const dx = b.x + shakeX;
  const dy = b.y + bobY + shakeY;

  // shadow on the ground would be too far — skip

  // outer glow
  if (stunned) {
    if (wakingUp) {
      const flash = (Math.sin(b.stunTimer * 0.6) + 1) / 2;
      ctx.fillStyle = `rgba(255, ${Math.floor(80 + flash * 100)}, 60, ${0.35 + flash * 0.3})`;
    } else {
      ctx.fillStyle = 'rgba(120, 200, 255, 0.35)';
    }
    ctx.fillRect(dx - 4, dy - 4, b.w + 8, b.h + 8);
  } else {
    // idle hover halo (faint cyan-ish exhaust below)
    ctx.fillStyle = 'rgba(255, 180, 60, 0.18)';
    ctx.fillRect(dx + 4, dy + b.h, b.w - 8, 4);
    ctx.fillStyle = 'rgba(255, 180, 60, 0.10)';
    ctx.fillRect(dx + 8, dy + b.h + 4, b.w - 16, 3);
  }

  // body — round-ish via stacked rects
  let bodyColor = '#d97a2a';
  let bodyDark  = '#a04a0c';
  if (stunned) {
    if (wakingUp) {
      const flash = Math.floor(b.stunTimer / 6) % 2 === 0;
      bodyColor = flash ? '#ff7755' : '#7ecbff';
      bodyDark  = flash ? '#cc3322' : '#3a8acc';
    } else {
      bodyColor = '#7ecbff';
      bodyDark  = '#3a8acc';
    }
  }
  // top + bottom slimmer rows make it look round
  ctx.fillStyle = bodyDark;
  ctx.fillRect(dx + 4, dy,                 b.w - 8, 3);
  ctx.fillRect(dx + 4, dy + b.h - 3,       b.w - 8, 3);
  ctx.fillRect(dx,     dy + 3,             b.w,     b.h - 6);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(dx + 6, dy + 1,             b.w - 12, 1);
  ctx.fillRect(dx + 2, dy + 4,             b.w - 4,  b.h - 8);

  // little propeller "tail" lights along the sides
  if (!stunned) {
    const blink = Math.floor(t * 4) % 2;
    ctx.fillStyle = blink ? '#ffee44' : '#cc8800';
    ctx.fillRect(dx + 1,           dy + b.h / 2 - 1, 2, 2);
    ctx.fillRect(dx + b.w - 3,     dy + b.h / 2 - 1, 2, 2);
  }

  // eyes
  if (stunned) {
    if (wakingUp) {
      const open = Math.floor(b.stunTimer / 8) % 2 === 0;
      ctx.fillStyle = open ? '#ff3344' : '#222';
      ctx.fillRect(dx + 7,         dy + 10, 4, 3);
      ctx.fillRect(dx + b.w - 11,  dy + 10, 4, 3);
    } else {
      ctx.fillStyle = '#222';
      ctx.fillRect(dx + 6,         dy + 11, 6, 2);
      ctx.fillRect(dx + b.w - 12,  dy + 11, 6, 2);
    }
  } else {
    const facingRight = b.vx >= 0;
    ctx.fillStyle = '#ffffff';
    if (facingRight) {
      ctx.fillRect(dx + b.w - 13, dy + 9, 4, 5);
      ctx.fillRect(dx + b.w - 7,  dy + 9, 4, 5);
    } else {
      ctx.fillRect(dx + 3, dy + 9, 4, 5);
      ctx.fillRect(dx + 9, dy + 9, 4, 5);
    }
    ctx.fillStyle = '#222';
    if (facingRight) {
      ctx.fillRect(dx + b.w - 11, dy + 10, 2, 3);
      ctx.fillRect(dx + b.w - 5,  dy + 10, 2, 3);
    } else {
      ctx.fillRect(dx + 5, dy + 10, 2, 3);
      ctx.fillRect(dx + 11, dy + 10, 2, 3);
    }
  }

  // exclamation mark above bot when about to wake
  if (wakingUp) {
    const bob = Math.sin(b.stunTimer * 0.4) * 2;
    ctx.fillStyle = '#ffee44';
    ctx.fillRect(dx + b.w / 2 - 2, dy - 18 + bob, 4, 8);
    ctx.fillRect(dx + b.w / 2 - 2, dy - 8 + bob,  4, 3);
    ctx.fillStyle = '#cc8800';
    ctx.fillRect(dx + b.w / 2 - 2, dy - 18 + bob, 1, 11);
  }

  // stun-time bar
  if (stunned) {
    const pct = b.stunTimer / STUN_DURATION;
    const r = Math.floor(255 - 135 * pct);
    const g = Math.floor( 80 + 120 * pct);
    const bl = Math.floor( 80 + 175 * pct);
    const barY = wakingUp ? b.y - 28 : b.y - 7;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(b.x, barY, b.w, 4);
    ctx.fillStyle = `rgb(${r}, ${g}, ${bl})`;
    ctx.fillRect(b.x, barY, b.w * pct, 4);
  }
}

function drawBot(b) {
  if (b.type === 'floater') { drawFloaterBot(b); return; }
  if (b.type === 'sentry')  { drawSentryBot(b);  return; }
  if (b.type === 'charger') { drawChargerBot(b); return; }
  const stunned = b.stunTimer > 0;
  const wakingUp = stunned && b.stunTimer <= WAKE_WARNING_FRAMES;

  // Shake offset — only used for drawing, not for collision/logic
  let shakeX = 0;
  let shakeY = 0;
  if (wakingUp) {
    // intensity ramps up as wake-up approaches: 1 → ~4
    const intensity = 1 + (1 - b.stunTimer / WAKE_WARNING_FRAMES) * 3;
    shakeX = (Math.random() - 0.5) * 2 * intensity;
    shakeY = (Math.random() - 0.5) * 1.5 * intensity;
  }
  const dx = b.x + shakeX;
  const dy = b.y + shakeY;

  // shadow under bot (no shake)
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(b.x + 2, b.y + b.h - 2, b.w - 4, 2);

  // glow halo: blue when calm, flashing red/orange when waking
  if (stunned) {
    if (wakingUp) {
      // pulsing red warning
      const flash = (Math.sin(b.stunTimer * 0.6) + 1) / 2;
      ctx.fillStyle = `rgba(255, ${Math.floor(80 + flash * 100)}, 60, ${0.35 + flash * 0.3})`;
    } else {
      ctx.fillStyle = 'rgba(120, 200, 255, 0.35)';
    }
    ctx.fillRect(dx - 3, dy - 3, b.w + 6, b.h + 6);
  }

  // body color
  let bodyColor = '#8a8a95';
  let bodyDark = '#5a5a65';
  if (stunned) {
    if (wakingUp) {
      // flash between blue and red
      const flash = Math.floor(b.stunTimer / 6) % 2 === 0;
      bodyColor = flash ? '#ff7755' : '#7ecbff';
      bodyDark  = flash ? '#cc3322' : '#3a8acc';
    } else {
      bodyColor = '#7ecbff';
      bodyDark  = '#3a8acc';
    }
  }
  ctx.fillStyle = bodyColor;
  ctx.fillRect(dx, dy + 6, b.w, b.h - 6);
  ctx.fillStyle = bodyDark;
  ctx.fillRect(dx, dy + b.h - 4, b.w, 4);

  // grass tufts on top
  ctx.fillStyle = '#4a7a2a';
  ctx.fillRect(dx + 2,         dy + 2, 6, 6);
  ctx.fillRect(dx + 11,        dy,     6, 8);
  ctx.fillRect(dx + b.w - 8,   dy + 3, 6, 5);
  ctx.fillStyle = '#6da93b';
  ctx.fillRect(dx + 12,        dy + 1, 3, 4);

  if (stunned) {
    if (wakingUp) {
      // eyes cracking open: small red slits, blink rapidly
      const open = Math.floor(b.stunTimer / 8) % 2 === 0;
      ctx.fillStyle = open ? '#ff3344' : '#222';
      const eyeY = dy + 13;
      ctx.fillRect(dx + 7,  eyeY, 4, 3);
      ctx.fillRect(dx + 19, eyeY, 4, 3);
    } else {
      // closed eyes (zzz)
      ctx.fillStyle = '#222';
      const cy = dy + 14;
      ctx.fillRect(dx + 6,  cy, 6, 2);
      ctx.fillRect(dx + 18, cy, 6, 2);
    }
  } else {
    // open angry eyes, facing direction of travel
    const facingRight = b.vx >= 0;
    ctx.fillStyle = '#ff3344';
    const eyeY = dy + 12;
    if (facingRight) {
      ctx.fillRect(dx + b.w - 12, eyeY, 4, 4);
      ctx.fillRect(dx + b.w - 6,  eyeY, 4, 4);
    } else {
      ctx.fillRect(dx + 2, eyeY, 4, 4);
      ctx.fillRect(dx + 8, eyeY, 4, 4);
    }
  }

  // exclamation mark above bot when about to wake
  if (wakingUp) {
    const bob = Math.sin(b.stunTimer * 0.4) * 2;
    ctx.fillStyle = '#ffee44';
    ctx.fillRect(dx + b.w / 2 - 2, dy - 18 + bob, 4, 8);
    ctx.fillRect(dx + b.w / 2 - 2, dy - 8 + bob,  4, 3);
    ctx.fillStyle = '#cc8800';
    ctx.fillRect(dx + b.w / 2 - 2, dy - 18 + bob, 1, 11);
  }

  // stun-time bar above bot
  if (stunned) {
    const pct = b.stunTimer / STUN_DURATION;
    const r = Math.floor(255 - 135 * pct);
    const g = Math.floor( 80 + 120 * pct);
    const bl = Math.floor( 80 + 175 * pct);
    const barY = wakingUp ? b.y - 28 : b.y - 7;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(b.x, barY, b.w, 4);
    ctx.fillStyle = `rgb(${r}, ${g}, ${bl})`;
    ctx.fillRect(b.x, barY, b.w * pct, 4);
  }
}

function drawHUD() {
  for (let i = 0; i < MAX_HEARTS; i++) {
    const x = 12 + i * 28;
    const y = 12;
    const filled = i < player.hearts;
    ctx.fillStyle = filled ? '#ff4466' : 'rgba(0,0,0,0.25)';
    drawHeart(x, y, filled);
  }
  // Level label, top-right
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.font = '600 16px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(levelName, W - 14, 28);
  ctx.textAlign = 'left';
  // Mute indicator, top-right just below level label
  if (muted) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.font = '600 12px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('🔇 muted (M)', W - 14, 46);
    ctx.textAlign = 'left';
  }
}

function drawKonamiNotif() {
  if (konamiNotifyTimer <= 0) return;
  konamiNotifyTimer--;
  const alpha = Math.min(1, konamiNotifyTimer / 40);
  const y = 110;
  ctx.fillStyle = `rgba(20, 10, 40, ${0.75 * alpha})`;
  ctx.fillRect(W / 2 - 200, y, 400, 56);
  ctx.fillStyle = `rgba(255, 215, 60, ${alpha})`;
  ctx.font = '800 22px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★ MIDAIR SUPER UNLOCKED ★', W / 2, y + 26);
  ctx.fillStyle = `rgba(255, 255, 255, ${0.8 * alpha})`;
  ctx.font = '500 12px -apple-system, sans-serif';
  ctx.fillText('you can now super even from a midair dash', W / 2, y + 46);
  ctx.textAlign = 'left';
}

// Baba-style rule images
const flagImg = new Image();
flagImg.src = 'assets/flag.png';
const isImg = new Image();
isImg.src = 'assets/is.png';
const winImg = new Image();
winImg.src = 'assets/win.png';

function drawBabaRule() {
  if (!babaRule) return;
  const bob = Math.sin(performance.now() / 450) * 2.5;
  const size = 44;
  const gap = 8;
  const y = babaRule.y + bob;
  let x = babaRule.x;

  const prevSmooth = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = false;

  if (flagImg.complete && flagImg.naturalWidth) ctx.drawImage(flagImg, x, y, size, size);
  x += size + gap;
  if (isImg.complete && isImg.naturalWidth)   ctx.drawImage(isImg,   x, y, size, size);
  x += size + gap;
  if (winImg.complete && winImg.naturalWidth) ctx.drawImage(winImg,  x, y, size, size);

  ctx.imageSmoothingEnabled = prevSmooth;
}

function drawGoal() {
  if (!goal) return;
  // pole
  ctx.fillStyle = '#7a5a2a';
  ctx.fillRect(goal.x + goal.w / 2 - 2, goal.y, 4, goal.h);
  // flag — pulses with a gentle wave
  const t = performance.now() / 200;
  const wave = Math.sin(t) * 3;
  ctx.fillStyle = '#ffdd33';
  ctx.fillRect(goal.x + goal.w / 2 + 2, goal.y + 4 + wave, 18, 14);
  ctx.fillStyle = '#cc8800';
  ctx.fillRect(goal.x + goal.w / 2 + 2, goal.y + 16 + wave, 18, 2);
  // sparkles
  for (let i = 0; i < 3; i++) {
    const sx = goal.x + goal.w / 2 + Math.sin(t * 1.3 + i * 2) * 14;
    const sy = goal.y + 30 + Math.cos(t * 1.1 + i * 1.7) * 18;
    ctx.fillStyle = 'rgba(255, 230, 100, 0.7)';
    ctx.fillRect(sx, sy, 3, 3);
  }
}

function drawBoss() {
  if (!boss) return;

  const t = performance.now() / 200;
  const state = boss.state;
  let bodyColor, bodyDark, eyeColor, eyeShape = 'open';

  if (state === 'defeated') {
    bodyColor = '#333';
    bodyDark  = '#1a1a1a';
    eyeColor  = '#444';
    eyeShape  = 'x';
  } else if (state === 'stunned') {
    bodyColor = '#7ecbff';
    bodyDark  = '#3a8acc';
    eyeColor  = '#222';
    eyeShape  = 'closed';
  } else if (state === 'telegraph') {
    const flash = Math.floor(boss.stateTimer / 6) % 2 === 0;
    bodyColor = flash ? '#ff5544' : '#aa6655';
    bodyDark  = flash ? '#aa2211' : '#552222';
    eyeColor  = '#ffee44';
  } else if (state === 'attacking') {
    bodyColor = '#ff3322';
    bodyDark  = '#88110a';
    eyeColor  = '#ffee44';
  } else {
    // vulnerable
    bodyColor = '#9a9aab';
    bodyDark  = '#5a5a6a';
    eyeColor  = '#33ff66';
  }

  // shake when telegraphing or attacking
  let shakeX = 0;
  if (state === 'telegraph' || state === 'attacking') {
    const intensity = state === 'attacking' ? 1.5 : 2.5;
    shakeX = (Math.random() - 0.5) * intensity;
  }
  const bx = boss.x + shakeX;
  const by = boss.y;

  // outer glow during telegraph/attack
  if (state === 'telegraph' || state === 'attacking') {
    ctx.fillStyle = state === 'attacking' ? 'rgba(255, 60, 30, 0.35)' : 'rgba(255, 200, 60, 0.25)';
    ctx.fillRect(bx - 6, by - 6, boss.w + 12, boss.h + 12);
  }
  if (state === 'vulnerable') {
    const pulse = (Math.sin(t * 2) + 1) / 2;
    ctx.fillStyle = `rgba(60, 255, 120, ${0.18 + pulse * 0.18})`;
    ctx.fillRect(bx - 4, by - 4, boss.w + 8, boss.h + 8);
  }

  // body — chunky rectangles for a robot look
  ctx.fillStyle = bodyDark;
  ctx.fillRect(bx, by, boss.w, boss.h);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(bx + 4, by + 4, boss.w - 8, boss.h - 8);

  // shoulder bolts
  ctx.fillStyle = '#222';
  ctx.fillRect(bx + 6,             by + 8,  6, 6);
  ctx.fillRect(bx + boss.w - 12,   by + 8,  6, 6);

  // visor / face plate
  ctx.fillStyle = '#222';
  ctx.fillRect(bx + 10, by + 20, boss.w - 20, 22);

  // eye
  if (eyeShape === 'closed') {
    ctx.fillStyle = '#666';
    ctx.fillRect(bx + 18, by + 30, boss.w - 36, 3);
  } else if (eyeShape === 'x') {
    ctx.fillStyle = '#666';
    ctx.fillRect(bx + 18, by + 26, 4, 12);
    ctx.fillRect(bx + boss.w - 22, by + 26, 4, 12);
  } else {
    ctx.fillStyle = eyeColor;
    const eyeW = boss.w - 36;
    ctx.fillRect(bx + 18, by + 26, eyeW, 10);
    if (state === 'attacking') {
      // pupil tracking player
      const px = player.x + player.w / 2;
      const ex = bx + 18 + eyeW / 2;
      const lookDir = Math.max(-1, Math.min(1, (px - ex) / 100));
      ctx.fillStyle = '#222';
      ctx.fillRect(bx + 18 + eyeW / 2 - 3 + lookDir * (eyeW / 2 - 4), by + 28, 6, 6);
    }
  }

  // chest panel ("mouth") — width scales with max HP so all HP ticks fit
  const maxHp = boss.maxHp || boss.hp;
  const tickGap = 2;
  const tickW = Math.max(3, Math.min(10, Math.floor((boss.w - 28) / maxHp) - tickGap));
  const ticksTotalW = maxHp * tickW + (maxHp - 1) * tickGap;
  const panelW = Math.max(boss.w - 28, ticksTotalW + 12);
  const panelX = bx + boss.w / 2 - panelW / 2;
  ctx.fillStyle = bodyDark;
  ctx.fillRect(panelX, by + boss.h - 24, panelW, 14);
  ctx.fillStyle = '#ffaa33';
  const ticksStartX = bx + boss.w / 2 - ticksTotalW / 2;
  for (let i = 0; i < boss.hp; i++) {
    ctx.fillRect(ticksStartX + i * (tickW + tickGap), by + boss.h - 20, tickW, 6);
  }

  // HP label above boss
  if (state !== 'defeated') {
    const maxHp = boss.maxHp || boss.hp;
    const slotW = 14;
    const slotGap = 3;
    const totalW = maxHp * slotW + (maxHp - 1) * slotGap;
    const startX = bx + boss.w / 2 - totalW / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(startX - 4, by - 14, totalW + 8, 8);
    for (let i = 0; i < maxHp; i++) {
      ctx.fillStyle = (i < boss.hp) ? '#ff4466' : 'rgba(255,255,255,0.2)';
      ctx.fillRect(startX + i * (slotW + slotGap), by - 12, slotW, 4);
    }
  }

}

function drawProjectiles() {
  for (const p of projectiles) {
    if (p.enemy) {
      // smaller, orange-yellow turret bolt
      ctx.fillStyle = 'rgba(255, 200, 60, 0.4)';
      const tx = p.vx > 0 ? p.x - 5 : p.x + p.w;
      ctx.fillRect(tx, p.y + 1, 5, p.h - 2);
      ctx.fillStyle = '#ffaa22';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#ffee88';
      ctx.fillRect(p.x, p.y + 1, p.w, 2);
    } else {
      // boss projectile — bigger red bolt
      ctx.fillStyle = 'rgba(255, 120, 60, 0.4)';
      const tx = p.vx > 0 ? p.x - 8 : p.x + p.w;
      ctx.fillRect(tx, p.y + 1, 8, p.h - 2);
      ctx.fillStyle = '#ff4422';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#ffaa66';
      ctx.fillRect(p.x, p.y + 2, p.w, 2);
    }
  }
}

function drawLevelComplete() {
  // dim overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);
  // title
  ctx.fillStyle = '#ffee77';
  ctx.font = '700 48px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Level Complete!', W / 2, H / 2 - 20);
  // subtitle
  ctx.fillStyle = '#fff';
  ctx.font = '500 18px -apple-system, sans-serif';
  const isLast = currentLevel + 1 >= LEVELS.length;
  const blink = Math.floor(levelCompleteTimer / 30) % 2 === 0;
  if (blink && levelCompleteTimer > 30) {
    ctx.fillText(
      isLast ? 'You finished all the levels! Press SPACE to play again.' : 'Press SPACE to continue',
      W / 2, H / 2 + 30
    );
  }
  ctx.textAlign = 'left';
}

function drawHeart(x, y, filled) {
  ctx.fillStyle = filled ? '#ff4466' : 'rgba(255,255,255,0.4)';
  ctx.fillRect(x + 2, y,     6, 8);
  ctx.fillRect(x + 12, y,    6, 8);
  ctx.fillRect(x,     y + 4, 20, 6);
  ctx.fillRect(x + 2, y + 10, 16, 4);
  ctx.fillRect(x + 6, y + 14, 8, 3);
  ctx.fillRect(x + 9, y + 17, 2, 2);
  if (!filled) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x + 4, y + 2, 12, 12);
  }
}

function drawGameFrame() {
  drawSky();
  drawBabaRule();
  for (const p of platforms) drawPlatform(p);
  drawGoal();
  drawBoss();
  for (const b of bots) drawBot(b);
  drawProjectiles();
  drawPlayer();
  drawHUD();
  drawKonamiNotif();
  if (levelComplete) drawLevelComplete();
}

function syncInfoBar() {
  const info = document.getElementById('info');
  if (info) info.style.display = (gameState === 'playing') ? '' : 'none';
}

function loop() {
  consumeClick();
  syncInfoBar();
  if (gameState === 'playing') {
    update();
    drawGameFrame();
  } else if (gameState === 'paused') {
    drawPauseMenu();
  } else if (gameState === 'menu') {
    drawMainMenu();
  } else if (gameState === 'levelSelect') {
    drawLevelSelect();
  }
  requestAnimationFrame(loop);
}

// Pre-load the saved level so PLAY from menu is instant, but stay on menu first.
loadLevel(loadSavedLevel());
gameState = 'menu';
loop();
</script>
