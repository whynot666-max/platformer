<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Platformer</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
    height: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #info {
    margin-bottom: 12px;
    font-size: 14px;
    opacity: 0.85;
    text-align: center;
    padding: 0 12px;
  }
  #game-wrap {
    position: relative;
    max-width: 100vw;
    max-height: 100vh;
  }
  canvas {
    display: block;
    background: #87ceeb;
    border: 3px solid #333;
    border-radius: 6px;
    image-rendering: pixelated;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    width: min(calc(100vw - 24px), calc((100vh - 80px) * 1.6));
    height: auto;
    aspect-ratio: 800 / 500;
  }

  /* Touch controls — hidden by default, shown on touch devices */
  .touch-pad {
    position: absolute;
    bottom: 4%;
    display: none;
    gap: 12px;
    z-index: 10;
    pointer-events: auto;
  }
  .touch-pad-left  { left: 3%;  }
  .touch-pad-right { right: 3%; }
  .touch-btn {
    width: clamp(48px, 9vmin, 80px);
    height: clamp(48px, 9vmin, 80px);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 3px solid rgba(255, 255, 255, 0.55);
    color: white;
    font-size: clamp(11px, 1.8vmin, 16px);
    font-weight: 800;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    padding: 0;
  }
  .touch-btn.dash { background: rgba(126, 203, 255, 0.35); border-color: rgba(126, 203, 255, 0.8); }
  .touch-btn.jump { background: rgba(255, 204, 68, 0.35);  border-color: rgba(255, 204, 68, 0.8); }
  .touch-btn:active { transform: scale(0.92); filter: brightness(1.4); }

  @media (hover: none) and (pointer: coarse) {
    #info { display: none; }
    .touch-pad { display: flex; }
    body { padding: 0; }
    canvas { width: 100vw; max-height: 100vh; }
  }
</style>
</head>
<body>
<div id="info">walk: <b>A / D</b> or <b>← →</b> &nbsp;·&nbsp; jump: <b>W</b>, <b>Space</b>, or <b>↑</b> &nbsp;·&nbsp; dash: <b>J</b> or <b>Shift</b> &nbsp;·&nbsp; pause: <b>Esc</b> or <b>P</b> &nbsp;·&nbsp; mute: <b>M</b> &nbsp;·&nbsp; restart: <b>R</b></div>
<div id="game-wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div class="touch-pad touch-pad-left">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>
  <div class="touch-pad touch-pad-right">
    <button class="touch-btn dash" id="btn-dash">DASH</button>
    <button class="touch-btn jump" id="btn-jump">JUMP</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const GRAVITY = 0.6;
const FRICTION = 0.82;
const MOVE_ACCEL = 0.8;
const MAX_SPEED = 5;
const JUMP_POWER = 12.5;
const DASH_SPEED = 15;
const DASH_DURATION = 12;   // frames the dash lasts (~1/5 second). distance = SPEED * DURATION
const DASH_COOLDOWN = 20;   // frames before you can dash again (~1/3 second)
const SUPER_BOOST_FRAMES = 14; // after a dash-cancelled super-jump, frames you keep extra horizontal speed

const MAX_HEARTS = 3;
const INVULN_FRAMES = 36;       // was 60 — shorter so damage-boosting is riskier
const HURT_KNOCKBACK_X = 6;
const HURT_KNOCKBACK_Y = -8;
const STUN_DURATION = 240;  // frames a bot stays frozen (~4 seconds)

const player = {
  x: 80,
  y: 100,
  w: 28,
  h: 40,
  vx: 0,
  vy: 0,
  onGround: false,
  facing: 1,
  dashTimer: 0,
  dashCooldown: 0,
  dashDir: 1,
  dashFromGround: false,
  dashAvailable: true,    // refunded on ground touch (or always true if konami unlocked)
  superBoost: 0,
  lateSuperTimer: 0,      // coyote window after a super ends — jump here = another super
  hearts: MAX_HEARTS,
  invulnTimer: 0,
};

// Konami unlock (↑↑↓↓←→←→ B A Enter) — enables midair super
// Reverse sequence locks it back down
const KONAMI_KEY = 'platformer.konami';
const KONAMI_SEQ = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA','Enter'];
const KONAMI_REV_SEQ = [...KONAMI_SEQ].reverse();
let konamiUnlocked = (() => {
  try { return localStorage.getItem(KONAMI_KEY) === '1'; } catch (e) { return false; }
})();
let konamiBuf = [];
let konamiNotifyTimer = 0;
let konamiLockNotifyTimer = 0;

// Frames after a super ends in which a fresh jump press still triggers a super
// and refunds a midair dash. Lets you chain supers with a tight input.
const LATE_SUPER_FRAMES = 6;

// Current-level state (filled by loadLevel)
let platforms = [];
let bots = [];
let projectiles = [];
let boss = null;
let goal = null;
let spawn = { x: 80, y: 100 };
let babaRule = null;
let currentTheme = 'field';

// Boss state machine timings (frames)
const BOSS_VULN_FRAMES   = 180;  // 3.0s vulnerable
const BOSS_STUN_FRAMES   = 120;  // 2.0s stunned after a dash hit
const BOSS_TELE_FRAMES   = 50;   // 0.83s telegraph (was 60)
const BOSS_ATK_FRAMES    = 120;  // 2.0s attacking (was 90)
const BOSS_PROJ_INTERVAL = 20;   // shoot a projectile every 0.33s (was 30) — denser barrage
const BOSS_PROJ_SPEED    = 7;
let levelName = '';
let currentLevel = 0;
let levelComplete = false;
let levelCompleteTimer = 0;

// Top-level screen the player is on. Transitions:
//   menu ⇄ levelSelect, menu → playing, playing ⇄ paused, paused → menu/levelSelect
//   playing → gameOver → menu (when out of lives)
//   menu ⇄ timeTrialMenu, timeTrialMenu → trialLevelSelect → playing
//   playing → trialResults → menu
let gameState = 'menu';
const LIVES_PER_WORLD = 3;
let livesLeft = LIVES_PER_WORLD;
let gameOverTimer = 0;

// ─────────── Time Trial state ───────────
const FRAME_MS = 1000 / 60;
const TT_KEYS = {
  levelPbs: 'platformer.trial.levelPbs',
  rangePbs: 'platformer.trial.rangePbs',
  fullPb:   'platformer.trial.fullPb',
};

function loadJson(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function saveJson(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

function loadLevelPbs() {
  const arr = loadJson(TT_KEYS.levelPbs, null);
  if (Array.isArray(arr) && arr.length >= 30) return arr.slice(0, 30);
  return new Array(30).fill(null);
}
function loadRangePbs()    { return loadJson(TT_KEYS.rangePbs, {}); }
function loadFullPb()      { return loadJson(TT_KEYS.fullPb, null); }

let levelPbs  = loadLevelPbs();
let rangePbs  = loadRangePbs();
let fullPb    = loadFullPb();

// Active trial state. null when no trial in progress.
//   type:    'single' | 'range' | 'full'
//   startIdx, endIdx (inclusive)
//   elapsedMs, splits[], deaths
//   finished, dnf, newBest
let timeTrial = null;

let trialMenuCursor = 0;
let trialSelectMode = 'single'; // 'single' | 'rangeStart' | 'rangeEnd'
let rangePickStart  = null;
let trialResultsCursor = 0;

// ─────────── Level Editor state + storage ───────────
const ED_DRAFT_KEY = 'platformer.editor.draft';
const ED_PB_KEY    = 'platformer.custom.pb';

// Bot kind chars for compact storage
const BOT_KIND_CHARS = { sprout: 's', floater: 'f', sentry: 'n', charger: 'c' };
const BOT_KIND_FROM_CHAR = { s: 'sprout', f: 'floater', n: 'sentry', c: 'charger' };

// Inflate an editor-form bot into a runtime bot (the shape loadLevel expects).
function inflateBot(b) {
  if (b.kind === 'sprout')  return sprout(b.x, b.y, b.pMin, b.pMax, b.speed ?? 1.3);
  if (b.kind === 'floater') return floater(b.x, b.y, b.pMin, b.pMax, b.speed ?? 1.4);
  if (b.kind === 'sentry')  return sentry(b.x, b.y, b.interval ?? 90);
  if (b.kind === 'charger') return charger(b.x, b.y, b.pMin, b.pMax, b.speed ?? 1.3);
  return null;
}

// Editor-form ↔ runtime-form. Editor-form is what the editor and storage
// manipulate; runtime-form is what loadLevel/initFromLevelObject consume.
function levelToRuntime(ed) {
  return {
    name: ed.name,
    theme: ed.theme,
    spawn: { x: ed.spawn.x, y: ed.spawn.y },
    platforms: ed.platforms.map((p) => ({ ...p })),
    bots: ed.bots.map(inflateBot).filter(Boolean),
    goal: ed.goal ? { ...ed.goal } : null,
    babaRule: ed.babaRule ? { ...ed.babaRule } : null,
    boss: ed.boss ? { ...ed.boss, isFinal: false } : null,
  };
}

// Compact JSON ↔ editor-form. Uses short keys + integer truncation to keep
// shared URLs small.
function compactLevel(ed) {
  const c = {
    v: 1,
    n: ed.name || 'Custom',
    t: ed.theme || 'field',
    s: [Math.round(ed.spawn.x), Math.round(ed.spawn.y)],
    p: ed.platforms.map((p) => [Math.round(p.x), Math.round(p.y), Math.round(p.w), Math.round(p.h)]),
    b: ed.bots.map((b) => {
      const arr = [BOT_KIND_CHARS[b.kind] || 's', Math.round(b.x), Math.round(b.y)];
      if (b.kind === 'sentry') arr.push(b.interval ?? 90);
      else arr.push(Math.round(b.pMin ?? b.x), Math.round(b.pMax ?? b.x + 50), b.speed ?? 1.3);
      return arr;
    }),
    g: ed.goal ? [Math.round(ed.goal.x), Math.round(ed.goal.y), Math.round(ed.goal.w), Math.round(ed.goal.h)] : null,
  };
  if (ed.babaRule) c.r = [Math.round(ed.babaRule.x), Math.round(ed.babaRule.y)];
  if (ed.boss)     c.B = [Math.round(ed.boss.x), Math.round(ed.boss.y), Math.round(ed.boss.w), Math.round(ed.boss.h), ed.boss.hp];
  return c;
}

function expandLevel(c) {
  if (!c || c.v !== 1) return null;
  const ed = {
    name: String(c.n || 'Custom').slice(0, 32),
    theme: THEME_SKY[c.t] ? c.t : 'field',
    spawn: { x: c.s[0], y: c.s[1] },
    platforms: (c.p || []).map(([x, y, w, h]) => ({ x, y, w, h })),
    bots: (c.b || []).map((b) => {
      const kind = BOT_KIND_FROM_CHAR[b[0]] || 'sprout';
      if (kind === 'sentry') return { kind, x: b[1], y: b[2], interval: b[3] ?? 90 };
      return { kind, x: b[1], y: b[2], pMin: b[3], pMax: b[4], speed: b[5] ?? 1.3 };
    }),
    goal: c.g ? { x: c.g[0], y: c.g[1], w: c.g[2], h: c.g[3] } : null,
    babaRule: c.r ? { x: c.r[0], y: c.r[1] } : null,
    boss: c.B ? { x: c.B[0], y: c.B[1], w: c.B[2], h: c.B[3], hp: c.B[4], isFinal: false } : null,
  };
  return validateLevel(ed) ? ed : null;
}

function validateLevel(ed) {
  if (!ed || !ed.spawn) return false;
  if (typeof ed.spawn.x !== 'number' || typeof ed.spawn.y !== 'number') return false;
  if (!Array.isArray(ed.platforms) || ed.platforms.length > 80) return false;
  if (!Array.isArray(ed.bots) || ed.bots.length > 50) return false;
  for (const p of ed.platforms) {
    if (typeof p.x !== 'number' || typeof p.y !== 'number') return false;
    if (typeof p.w !== 'number' || typeof p.h !== 'number') return false;
    if (p.x < -100 || p.y < -100 || p.x + p.w > W + 100 || p.y + p.h > H + 100) return false;
  }
  for (const b of ed.bots) {
    if (!['sprout','floater','sentry','charger'].includes(b.kind)) return false;
    if (typeof b.x !== 'number' || typeof b.y !== 'number') return false;
  }
  return true;
}

// base64url (RFC 4648 §5) — survives chat-app auto-linkers
function b64urlEncode(str) {
  return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  try { return decodeURIComponent(escape(atob(s))); } catch (e) { return null; }
}

function encodeShareString(ed) {
  return b64urlEncode(JSON.stringify(compactLevel(ed)));
}
function decodeShareString(s) {
  const json = b64urlDecode(s);
  if (!json) return null;
  let parsed = null;
  try { parsed = JSON.parse(json); } catch (e) { return null; }
  return expandLevel(parsed);
}

// Custom-level state
let customLevelActive = null;    // runtime-form level; null = playing built-in
let returnToEditorOnExit = false; // set when test-play was launched from editor
let sharedLevelPending = null;   // editor-form level decoded from URL hash, awaiting prompt

// Per-content-hash PB store for custom levels
function customPbHash(ed) {
  // Cheap synchronous hash (FNV-1a-ish) over compact JSON minus name
  const c = compactLevel(ed); delete c.n;
  const s = JSON.stringify(c);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(36);
}
function loadCustomPbs() { return loadJson(ED_PB_KEY, {}); }
function saveCustomPbs(pbs) { saveJson(ED_PB_KEY, pbs); }

// Editor working state
const ED_BLANK = () => ({
  name: 'My Level',
  theme: 'field',
  spawn: { x: 80, y: 380 },
  platforms: [
    { x: 0, y: H - 40, w: W, h: 40 }, // a floor by default
  ],
  bots: [],
  goal: { x: 740, y: H - 40 - 60, w: 24, h: 60 },
  babaRule: null,
  boss: null,
});

let editorLevel = ED_BLANK();
let editorTool = 'select';
// editorSelection: null OR { type:'platform'|'bot'|'goal'|'spawn'|'baba'|'boss', index?: number }
let editorSelection = null;
let editorDrag = null;           // { type, mode:'move'|'resizeR'|'resizeB'|'resizeBR'|'patrolMin'|'patrolMax', ox, oy, orig }
let editorPatrolBot = null;      // bot whose patrol endpoints we're currently picking
let editorPatrolStep = 0;        // 0=picking pMin, 1=picking pMax
let editorDirty = false;
let editorToastMs = 0;
let editorToastText = '';
let sharedConfirmCursor = 0;

function editorToast(text, ms = 90) {
  editorToastText = text;
  editorToastMs = ms;
}

function saveEditorDraft() {
  saveJson(ED_DRAFT_KEY, compactLevel(editorLevel));
  editorDirty = false;
}
function loadEditorDraft() {
  const c = loadJson(ED_DRAFT_KEY, null);
  if (!c) return false;
  const ed = expandLevel(c);
  if (!ed) return false;
  editorLevel = ed;
  editorSelection = null;
  editorPatrolBot = null;
  editorDirty = false;
  return true;
}

const ED_TOOLS = [
  { id: 'select',  label: 'SELECT',  hotkey: 'V' },
  { id: 'platform',label: 'PLATFORM',hotkey: 'P' },
  { id: 'sprout',  label: 'SPROUT',  hotkey: 'S' },
  { id: 'floater', label: 'FLOATER', hotkey: 'F' },
  { id: 'sentry',  label: 'SENTRY',  hotkey: 'N' },
  { id: 'charger', label: 'CHARGER', hotkey: 'C' },
  { id: 'spawn',   label: 'SPAWN',   hotkey: 'H' },
  { id: 'goal',    label: 'GOAL',    hotkey: 'G' },
  { id: 'baba',    label: 'BABA',    hotkey: 'B' },
  { id: 'boss',    label: 'BOSS',    hotkey: 'X' },
  { id: 'delete',  label: 'DELETE',  hotkey: 'E' },
];
let menuCursor = 0;
let pauseCursor = 0;
let selectCursor = 0;   // 0..LEVELS.length-1
let mouseX = 0, mouseY = 0;
let clickQueued = false;

// Per-frame list of {x, y, w, h, action, label?, hoverIndex?} for the current
// screen. Re-built each frame in the screen's draw call; consumed by the click
// handler at the start of the next tick.
let clickables = [];

// ─────────── Audio (synthesized via Web Audio API; no files) ───────────
const MUTE_KEY = 'platformer.muted';
let muted = (() => {
  try { return localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { return false; }
})();

const audio = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function play({ freq = 440, type = 'square', dur = 0.1, vol = 0.2,
                  sweep = 0, sweepTo = null, attack = 0.005 }) {
    if (muted) return;
    const c = getCtx();
    if (!c) return;
    try {
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      const target = sweepTo !== null ? sweepTo : (freq + sweep);
      if (target !== freq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, target), t0 + dur);
      }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* never crash gameplay because of audio */ }
  }

  function chord(notes, dur = 0.18, vol = 0.16) {
    notes.forEach((n, i) => setTimeout(() => play({ freq: n, type: 'square', dur, vol }), i * 90));
  }

  return {
    jump:     () => play({ freq: 480, type: 'square',   dur: 0.08, vol: 0.14, sweep: 220 }),
    dash:     () => play({ freq: 720, type: 'sawtooth', dur: 0.09, vol: 0.16, sweep: 400 }),
    super:    () => play({ freq: 900, type: 'sawtooth', dur: 0.16, vol: 0.20, sweep: 700 }),
    stunHit:  () => play({ freq: 240, type: 'square',   dur: 0.13, vol: 0.22, sweepTo: 90 }),
    hurt:     () => play({ freq: 220, type: 'sawtooth', dur: 0.22, vol: 0.25, sweepTo: 80 }),
    die:      () => chord([392, 330, 262, 196], 0.18, 0.22),
    bossHit:  () => { play({ freq: 160, type: 'square', dur: 0.22, vol: 0.28, sweepTo: 70 });
                      setTimeout(() => play({ freq: 90, type: 'sawtooth', dur: 0.15, vol: 0.2, sweepTo: 40 }), 60); },
    bossShot: () => play({ freq: 1100, type: 'square',  dur: 0.05, vol: 0.10, sweepTo: 500 }),
    winLevel: () => chord([523, 659, 784], 0.18, 0.20),
    winGame:  () => chord([523, 659, 784, 1047], 0.22, 0.22),
  };
})();

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
}

// ─────────── helpers for compact level config ───────────
const sprout = (x, y, pMin, pMax, speed = 1.3) => ({
  type: 'sprout', x, y, w: 30, h: 26,
  vx: speed, speed,
  patrolMin: pMin, patrolMax: pMax, stunTimer: 0,
});
const floater = (x, y, pMin, pMax, speed = 1.4) => ({
  type: 'floater', x, y, w: 32, h: 28,
  vx: speed, speed,
  patrolMin: pMin, patrolMax: pMax, stunTimer: 0,
});
// Stationary turret. Fires a slow projectile at the player every ~1.5s.
const sentry = (x, y, shootInterval = 90) => ({
  type: 'sentry', x, y, w: 30, h: 28,
  vx: 0, speed: 0,
  patrolMin: x, patrolMax: x + 30,
  shootInterval, shootTimer: shootInterval,
  stunTimer: 0,
});
// Walks slowly. When the player is at the same height and within ~250px, it
// sprints at them.
const charger = (x, y, pMin, pMax, speed = 1.3) => ({
  type: 'charger', x, y, w: 30, h: 26,
  vx: speed, speed, chargeSpeed: 4.2,
  patrolMin: pMin, patrolMax: pMax,
  charging: false,
  stunTimer: 0,
});
const flag = (x = 750) => ({ x, y: H - 40 - 60, w: 24, h: 60 });
const floor = (x = 0, w = W) => ({ x, y: H - 40, w, h: 40 });
const bossArena = (theme, name, hp, isFinal = false) => ({
  name, theme,
  spawn: { x: 50, y: 380 },
  platforms: [
    floor(),
    // Side platforms — y=350 keeps them reachable with a regular ground jump
    // (max apex is ~130px above the floor) so you don't need a midair super
    // to use them for cover.
    { x: 80,  y: 350, w: 120, h: 18 },
    { x: 600, y: 350, w: 120, h: 18 },
  ],
  bots: [],
  boss: {
    x: isFinal ? W / 2 - 50 : W / 2 - 40,
    y: isFinal ? H - 40 - 120 : H - 40 - 90,
    w: isFinal ? 100 : 80,
    h: isFinal ? 120 : 90,
    hp,
    isFinal,
  },
});

// ─────────── 30 levels, 10 worlds × 3 ───────────
const LEVELS = [
  // ─── WORLD 1: FIELD ───
  {
    name: 'Field 1',
    theme: 'field',
    spawn: { x: 60, y: 380 },
    platforms: [
      { x: 0,   y: H - 40, w: 350, h: 40 },
      { x: 420, y: H - 40, w: 380, h: 40 },
      { x: 200, y: 400, w: 80,  h: 18 },
      { x: 320, y: 320, w: 100, h: 18 },
      { x: 500, y: 360, w: 100, h: 18 },

const keys = {};
let jumpQueued = false;
let dashQueued = false;
let advanceQueued = false;

// We key inputs by e.code (the physical key location), not e.key (the language-
// dependent character). KeyA on a Hebrew layout is still "KeyA" even though
// it physically prints ש. Means controls work regardless of input language.
window.addEventListener('keydown', (e) => {
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(c)) {
    e.preventDefault();
  }
  if (!keys[c]) {
    // Globally available — mute + Konami work on every screen
    if (c === 'KeyM') toggleMute();
    konamiBuf.push(c);
    if (konamiBuf.length > KONAMI_SEQ.length) konamiBuf.shift();
    if (konamiBuf.length === KONAMI_SEQ.length) {
      if (!konamiUnlocked && KONAMI_SEQ.every((k, i) => konamiBuf[i] === k)) {
        konamiUnlocked = true;
        try { localStorage.setItem(KONAMI_KEY, '1'); } catch (e) {}
        konamiNotifyTimer = 240;
        audio.winLevel();
      } else if (konamiUnlocked && KONAMI_REV_SEQ.every((k, i) => konamiBuf[i] === k)) {
        konamiUnlocked = false;
        try { localStorage.setItem(KONAMI_KEY, '0'); } catch (e) {}
        konamiLockNotifyTimer = 240;
        audio.die();
      }
    }

    if (gameState === 'playing') {
      if (c === 'KeyW' || c === 'Space' || c === 'ArrowUp') jumpQueued = true;
      if (c === 'KeyJ' || c === 'ShiftLeft' || c === 'ShiftRight') dashQueued = true;
      if (c === 'Space' || c === 'Enter') advanceQueued = true;
      if (c === 'KeyR') {
        // During a trial, R restarts the entire trial from its start.
        if (timeTrial) {
          const { type, startIdx, endIdx } = timeTrial;
          startTrial(type, startIdx, endIdx);
        } else {
          loadLevel(currentLevel);
        }
      }
      if (c === 'Escape' || c === 'KeyP') { gameState = 'paused'; pauseCursor = 0; }
      // Dev shortcuts — disabled inside a trial to avoid level-warp cheese
      if (!timeTrial) {
        if (c.startsWith('Digit') && c !== 'Digit0') {
          const idx = parseInt(c.slice(5), 10) - 1;
          if (idx < LEVELS.length) loadLevel(idx);
        }
        if (c === 'Digit0' && 9 < LEVELS.length) loadLevel(9);
        if (c === 'BracketRight' || c === 'Equal')
          loadLevel(Math.min(LEVELS.length - 1, currentLevel + 1));
        if (c === 'BracketLeft' || c === 'Minus')
          loadLevel(Math.max(0, currentLevel - 1));
      }
    } else if (gameState === 'paused') {
      if (c === 'Escape' || c === 'KeyP') gameState = 'playing';
      if (c === 'ArrowUp')   pauseCursor = (pauseCursor + PAUSE_OPTIONS.length - 1) % PAUSE_OPTIONS.length;
      if (c === 'ArrowDown') pauseCursor = (pauseCursor + 1) % PAUSE_OPTIONS.length;
      if (c === 'Enter' || c === 'Space') PAUSE_OPTIONS[pauseCursor].action();
    } else if (gameState === 'menu') {
      if (c === 'ArrowUp')   menuCursor = (menuCursor + MENU_OPTIONS.length - 1) % MENU_OPTIONS.length;
      if (c === 'ArrowDown') menuCursor = (menuCursor + 1) % MENU_OPTIONS.length;
      if (c === 'Enter' || c === 'Space') MENU_OPTIONS[menuCursor].action();
    } else if (gameState === 'levelSelect') {
      if (c === 'Escape') gameState = 'menu';
      if (c === 'ArrowLeft')  selectCursor = Math.max(0, selectCursor - 1);
      if (c === 'ArrowRight') selectCursor = Math.min(LEVELS.length - 1, selectCursor + 1);
      if (c === 'ArrowUp')    selectCursor = Math.max(0, selectCursor - LEVEL_SELECT_COLS);
      if (c === 'ArrowDown')  selectCursor = Math.min(LEVELS.length - 1, selectCursor + LEVEL_SELECT_COLS);
      if (c === 'Enter' || c === 'Space') { loadLevel(selectCursor); gameState = 'playing'; }
    } else if (gameState === 'timeTrialMenu') {
      if (c === 'Escape')    { gameState = 'menu'; menuCursor = 0; }
      if (c === 'ArrowUp')   trialMenuCursor = (trialMenuCursor + TRIAL_MENU_OPTIONS.length - 1) % TRIAL_MENU_OPTIONS.length;
      if (c === 'ArrowDown') trialMenuCursor = (trialMenuCursor + 1) % TRIAL_MENU_OPTIONS.length;
      if (c === 'Enter' || c === 'Space') TRIAL_MENU_OPTIONS[trialMenuCursor].action();
    } else if (gameState === 'trialLevelSelect') {
      if (c === 'Escape') {
        if (trialSelectMode === 'rangeEnd') { trialSelectMode = 'rangeStart'; rangePickStart = null; }
        else gameState = 'timeTrialMenu';
      }
      if (c === 'ArrowLeft')  selectCursor = Math.max(0, selectCursor - 1);
      if (c === 'ArrowRight') selectCursor = Math.min(LEVELS.length - 1, selectCursor + 1);
      if (c === 'ArrowUp')    selectCursor = Math.max(0, selectCursor - LEVEL_SELECT_COLS);
      if (c === 'ArrowDown')  selectCursor = Math.min(LEVELS.length - 1, selectCursor + LEVEL_SELECT_COLS);
      if (c === 'Enter' || c === 'Space') trialSelectConfirm(selectCursor);
    } else if (gameState === 'trialResults') {
      if (c === 'ArrowUp')   trialResultsCursor = (trialResultsCursor + 2) % 3;
      if (c === 'ArrowDown') trialResultsCursor = (trialResultsCursor + 1) % 3;
      if (c === 'Enter' || c === 'Space') trialResultsAction(trialResultsCursor);
      if (c === 'KeyR') trialResultsAction(0);
      if (c === 'Escape') { abortTrial(); gameState = 'menu'; menuCursor = 0; }
    } else if (gameState === 'editor') {
      // Tool hotkeys
      for (const t of ED_TOOLS) {
        if (c === 'Key' + t.hotkey) {
          editorTool = t.id;
          editorSelection = null;
          editorPatrolBot = null;
          break;
        }
      }
      if (c === 'Space') editorTestPlay();
      if (c === 'Escape') {
        if (editorPatrolBot) { editorPatrolBot = null; editorPatrolStep = 0; }
        else if (editorSelection) editorSelection = null;
        else { saveEditorDraft(); gameState = 'menu'; menuCursor = 0; }
      }
      if ((c === 'Delete' || c === 'Backspace') && editorSelection) {
        const sel = editorSelection;
        if (sel.type === 'platform') editorLevel.platforms.splice(sel.index, 1);
        else if (sel.type === 'bot') editorLevel.bots.splice(sel.index, 1);
        else if (sel.type === 'goal') editorLevel.goal = null;
        else if (sel.type === 'boss') editorLevel.boss = null;
        else if (sel.type === 'baba') editorLevel.babaRule = null;
        editorSelection = null;
        editorDirty = true;
        saveEditorDraft();
      }
      if (c === 'KeyT') editorCycleTheme();
    } else if (gameState === 'sharedConfirm') {
      if (c === 'ArrowUp')   sharedConfirmCursor = (sharedConfirmCursor + 2) % 3;
      if (c === 'ArrowDown') sharedConfirmCursor = (sharedConfirmCursor + 1) % 3;
      if (c === 'Enter' || c === 'Space') sharedConfirmAction(sharedConfirmCursor);
      if (c === 'Escape') { sharedLevelPending = null; gameState = 'menu'; menuCursor = 0; }
    }
  }
  keys[c] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Canvas mouse / touch — translate page coords into the 800x500 canvas space
function canvasPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width  / rect.width),
    y: (clientY - rect.top)  * (canvas.height / rect.height),
  };
}
canvas.addEventListener('mousemove', (e) => {
  const p = canvasPoint(e.clientX, e.clientY);
  mouseX = p.x; mouseY = p.y;
});
canvas.addEventListener('mousedown', (e) => {
  if (gameState === 'playing') return; // game uses keyboard/touch buttons
  const p = canvasPoint(e.clientX, e.clientY);
  mouseX = p.x; mouseY = p.y;
  if (gameState === 'editor') { editorMouseDown(mouseX, mouseY); return; }
  clickQueued = true;
});
canvas.addEventListener('mousemove', (e) => {
  if (gameState === 'editor') editorMouseMove(mouseX, mouseY);
});
canvas.addEventListener('mouseup', (e) => {
  if (gameState === 'editor') {
    const p = canvasPoint(e.clientX, e.clientY);
    editorMouseUp(p.x, p.y);
  }
});
canvas.addEventListener('touchstart', (e) => {
  if (gameState === 'playing') return;
  const t = e.touches[0]; if (!t) return;
  const p = canvasPoint(t.clientX, t.clientY);
  mouseX = p.x; mouseY = p.y;
  if (gameState === 'editor') { editorMouseDown(mouseX, mouseY); e.preventDefault(); return; }
  clickQueued = true;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  if (gameState !== 'editor') return;
  const t = e.touches[0]; if (!t) return;
  const p = canvasPoint(t.clientX, t.clientY);
  mouseX = p.x; mouseY = p.y;
  editorMouseMove(mouseX, mouseY);
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  if (gameState !== 'editor') return;
  editorMouseUp(mouseX, mouseY);
  e.preventDefault();
}, { passive: false });

const TRIAL_MENU_OPTIONS = [
  { label: 'SINGLE LEVEL', action: () => { trialSelectMode = 'single';     gameState = 'trialLevelSelect'; selectCursor = 0; rangePickStart = null; } },
  { label: 'RANGE',        action: () => { trialSelectMode = 'rangeStart'; gameState = 'trialLevelSelect'; selectCursor = 0; rangePickStart = null; } },
  { label: 'FULL GAME RUN',action: () => { startTrial('full', 0, LEVELS.length - 1); } },
  { label: 'BACK',         action: () => { gameState = 'menu'; menuCursor = 0; } },
];

const LEVEL_SELECT_COLS = 5;
const LEVEL_SELECT_ROWS = 6;

const MENU_OPTIONS = [
  { label: 'PLAY',         action: () => { loadLevel(loadSavedLevel()); gameState = 'playing'; } },
  { label: 'LEVEL SELECT', action: () => { gameState = 'levelSelect'; selectCursor = currentLevel ?? 0; } },
  { label: 'TIME TRIAL',   action: () => { gameState = 'timeTrialMenu'; trialMenuCursor = 0; } },
  { label: 'LEVEL EDITOR', action: () => { enterEditor(); } },
  { label: 'SOUND: ON',    dyn: () => 'SOUND: ' + (muted ? 'OFF' : 'ON'),
                            action: () => { toggleMute(); } },
];

function enterEditor() {
  // Restore the autosaved draft if present, else start blank
  if (!loadEditorDraft()) {
    editorLevel = ED_BLANK();
  }
  editorTool = 'select';
  editorSelection = null;
  editorPatrolBot = null;
  editorPatrolStep = 0;
  editorDrag = null;
  currentTheme = editorLevel.theme;
  gameState = 'editor';
}

const PAUSE_OPTIONS = [
  { label: 'RESUME',        action: () => { gameState = 'playing'; } },
  { label: 'RESTART LEVEL', dyn: () => timeTrial ? 'RESTART TRIAL'
                                       : customLevelActive ? 'RESTART LEVEL'
                                       : 'RESTART LEVEL',
                             action: () => {
                               if (timeTrial) {
                                 const { type, startIdx, endIdx } = timeTrial;
                                 startTrial(type, startIdx, endIdx);
                               } else if (customLevelActive) {
                                 loadCustomLevel(customLevelActive.editor, { fromEditor: returnToEditorOnExit });
                                 gameState = 'playing';
                               } else {
                                 loadLevel(currentLevel);
                                 gameState = 'playing';
                               }
                             } },
  { label: 'LEVEL SELECT',  action: () => {
                               if (timeTrial) abortTrial();
                               if (customLevelActive) {
                                 const ret = returnToEditorOnExit;
                                 customLevelActive = null;
                                 returnToEditorOnExit = false;
                                 if (ret) { gameState = 'editor'; return; }
                               }
                               gameState = 'levelSelect';
                               selectCursor = currentLevel ?? 0;
                             } },
  { label: 'MAIN MENU',     action: () => {
                               if (timeTrial) abortTrial();
                               customLevelActive = null;
                               returnToEditorOnExit = false;
                               gameState = 'menu'; menuCursor = 0;
                             } },
  { label: 'SOUND: ON',     dyn: () => 'SOUND: ' + (muted ? 'OFF' : 'ON'),
                             action: () => { toggleMute(); } },
];

// Process any pending click: walk the clickables registered by the most recent
// screen draw and fire the first match.
function consumeClick() {
  if (!clickQueued) return;
  clickQueued = false;
  for (const c of clickables) {
    if (mouseX >= c.x && mouseX <= c.x + c.w &&
        mouseY >= c.y && mouseY <= c.y + c.h) {
      c.action();
      return;
    }
  }
}

// Generic vertical menu rendering (used by main menu + pause)
function drawVerticalMenu(title, options, cursor, setCursor, subtitle) {
  clickables = [];
  // Dim background
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffdd33';
  ctx.font = '800 44px -apple-system, sans-serif';
  ctx.fillText(title, W / 2, 110);

  if (subtitle) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '500 14px -apple-system, sans-serif';
    ctx.fillText(subtitle, W / 2, 138);
  }

  const btnW = 280, btnH = 44, gap = 12;
  const startY = 180;
  for (let i = 0; i < options.length; i++) {
    const x = (W - btnW) / 2;
    const y = startY + i * (btnH + gap);
    const hovered = mouseX >= x && mouseX <= x + btnW && mouseY >= y && mouseY <= y + btnH;
    if (hovered) setCursor(i);
    const selected = i === cursor;
    // Button bg
    ctx.fillStyle = selected ? 'rgba(255, 221, 51, 0.25)' : 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect(x, y, btnW, btnH);
    // Border
    ctx.fillStyle = selected ? '#ffdd33' : 'rgba(255,255,255,0.35)';
    ctx.fillRect(x, y, btnW, 2);
    ctx.fillRect(x, y + btnH - 2, btnW, 2);
    ctx.fillRect(x, y, 2, btnH);
    ctx.fillRect(x + btnW - 2, y, 2, btnH);
    // Label
    ctx.fillStyle = selected ? '#ffdd33' : '#fff';
    ctx.font = '700 18px -apple-system, sans-serif';
    const label = options[i].dyn ? options[i].dyn() : options[i].label;
    ctx.fillText(label, W / 2, y + btnH / 2 + 6);

    clickables.push({ x, y, w: btnW, h: btnH, action: options[i].action });
  }

  // Hint footer
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '500 12px -apple-system, sans-serif';
  ctx.fillText('↑ ↓ to move · Enter to select · click also works', W / 2, H - 22);
  ctx.textAlign = 'left';
}

function drawMainMenu() {
  // Background — a gentle starfield so it's not pure black
  ctx.fillStyle = '#0e0b22';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137 + 23) % W;

  currentTheme = savedTheme;

  ctx.fillText(title, W / 2, 42);

    const y = startY + row * (cellH + gapY);
    const lvi = LEVELS[i];
    const isBoss = !!lvi.boss;
    const hovered = mouseX >= x && mouseX <= x + cellW && mouseY >= y && mouseY <= y + cellH;
    if (hovered && mouseY >= startY) selectCursor = i;
    const selected = i === selectCursor;
    const isStart  = i === rangePickStart;
    const disabled = trialSelectMode === 'rangeEnd' && i < rangePickStart;

    let bg = isBoss ? 'rgba(180, 40, 40, 0.30)' : 'rgba(255, 255, 255, 0.10)';
    if (isStart)  bg = 'rgba(80, 220, 120, 0.35)';
    if (selected) bg = 'rgba(255, 221, 51, 0.25)';
    if (disabled) bg = 'rgba(100, 100, 100, 0.20)';
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, cellW, cellH);

    const border = isStart ? '#66ff88'
                  : selected ? '#ffdd33'
                  : isBoss ? '#ff6644'
                  : 'rgba(255,255,255,0.45)';
    ctx.fillStyle = border;
    ctx.fillRect(x, y, cellW, 2);
    ctx.fillRect(x, y + cellH - 2, cellW, 2);
    ctx.fillRect(x, y, 2, cellH);
    ctx.fillRect(x + cellW - 2, y, 2, cellH);

    // Number + name
    ctx.fillStyle = disabled ? 'rgba(255,255,255,0.3)' : (selected ? '#ffdd33' : '#fff');
    ctx.font = '800 16px -apple-system, sans-serif';
    ctx.fillText(String(i + 1), x + cellW / 2, y + 20);
    ctx.font = '600 9px -apple-system, sans-serif';
    ctx.fillStyle = disabled ? 'rgba(255,255,255,0.3)' : (selected ? '#ffdd33' : 'rgba(255,255,255,0.7)');
    ctx.fillText(lvi.name, x + cellW / 2, y + 32);

    const pb = levelPbs[i];

    ctx.fillStyle = pb ? 'rgba(255, 230, 100, 0.85)' : 'rgba(255,255,255,0.35)';
    ctx.fillText(pb ? formatMs(pb) : '—', x + cellW / 2, y + 44);

    if (!disabled) {
      clickables.push({
        x, y, w: cellW, h: cellH,

    footer = rp ? `range ${rangePickStart + 1}–${selectCursor + 1}  ·  best ${formatMs(rp.ms)}  ·  Enter to start` :

  ctx.fillText(footer, W / 2, H - 18);
  ctx.textAlign = 'left';

  // Deaths + splits

      ctx.fillText(`+ ${tt.splits.length - maxShow} more…`, splitX, 200 + maxShow * 14);

  // Buttons
  const labels = ['RETRY', 'LEVEL SELECT', 'MAIN MENU'];
  const btnW = 200, btnH = 36, gap = 10;
  const startBtnY = H - btnH * labels.length - gap * (labels.length - 1) - 26;
  for (let i = 0; i < labels.length; i++) {

    const hovered = mouseX >= x && mouseX <= x + btnW && mouseY >= y && mouseY <= y + btnH;
    if (hovered) trialResultsCursor = i;
    const selected = i === trialResultsCursor;
    ctx.fillStyle = selected ? 'rgba(255, 221, 51, 0.25)' : 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect(x, y, btnW, btnH);
    ctx.fillStyle = selected ? '#ffdd33' : 'rgba(255,255,255,0.4)';
    ctx.fillRect(x, y, btnW, 2);
    ctx.fillRect(x, y + btnH - 2, btnW, 2);
    ctx.fillRect(x, y, 2, btnH);
    ctx.fillRect(x + btnW - 2, y, 2, btnH);
    ctx.fillStyle = selected ? '#ffdd33' : '#fff';
    ctx.font = '700 16px -apple-system, sans-serif';
    ctx.fillText(labels[i], W / 2, y + btnH / 2 + 5);
    clickables.push({ x, y, w: btnW, h: btnH, action: () => trialResultsAction(i) });
  }

  ctx.textAlign = 'left';
}

// ─────────── LEVEL EDITOR ───────────
const ED_TOOLBAR_H = 40;
const ED_INSP_W = 130;

function edHit(o, mx, my) {
  return mx >= o.x && mx <= o.x + o.w && my >= o.y && my <= o.y + o.h;
}

// Snap helper (8px grid)
function edSnap(n) { return Math.round(n / 8) * 8; }

// Build a list of "selectable" objects in the current editor level, in
// drawing-order so foreground objects are picked first.
function edHitTest(mx, my) {
  // Try boss
  if (editorLevel.boss) {
    const b = editorLevel.boss;
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h)
      return { type: 'boss' };
  }
  // Try goal
  if (editorLevel.goal) {
    const g = editorLevel.goal;
    if (mx >= g.x && mx <= g.x + g.w && my >= g.y && my <= g.y + g.h)
      return { type: 'goal' };
  }
  // Try bots
  for (let i = editorLevel.bots.length - 1; i >= 0; i--) {
    const b = editorLevel.bots[i];
    const w = b.kind === 'floater' ? 32 : 30;
    const h = b.kind === 'floater' ? 28 : 26;
    if (mx >= b.x && mx <= b.x + w && my >= b.y && my <= b.y + h)
      return { type: 'bot', index: i };
  }
  // Try spawn marker
  if (editorLevel.spawn && Math.abs(mx - editorLevel.spawn.x) < 14 && Math.abs(my - editorLevel.spawn.y) < 18)
    return { type: 'spawn' };
  // Try baba
  if (editorLevel.babaRule) {
    const r = editorLevel.babaRule;
    if (mx >= r.x && mx <= r.x + 168 && my >= r.y && my <= r.y + 50)
      return { type: 'baba' };
  }
  // Try platforms (last so foreground objects on top of them still pick)
  for (let i = editorLevel.platforms.length - 1; i >= 0; i--) {
    const p = editorLevel.platforms[i];
    if (mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h)
      return { type: 'platform', index: i };
  }
  return null;
}

function edGetSelected() {
  if (!editorSelection) return null;
  const s = editorSelection;
  if (s.type === 'platform') return editorLevel.platforms[s.index];
  if (s.type === 'bot')      return editorLevel.bots[s.index];
  if (s.type === 'goal')     return editorLevel.goal;
  if (s.type === 'spawn')    return editorLevel.spawn;
  if (s.type === 'baba')     return editorLevel.babaRule;
  if (s.type === 'boss')     return editorLevel.boss;
  return null;
}

function edClampX(v) { return Math.max(0, Math.min(W, v)); }
function edClampY(v) { return Math.max(0, Math.min(H, v)); }

// Mouse handlers driven by canvas listeners (we share with menu clickables)
let editorMouseDownAt = null;
let editorDragStart = null;

function editorMouseDown(mx, my) {
  // Toolbar clicks
  if (my < ED_TOOLBAR_H) {
    editorToolbarClick(mx, my);
    return;
  }
  // Inspector clicks (if a selection is showing)
  if (editorSelection && mx > W - ED_INSP_W) {
    editorInspectorClick(mx, my);
    return;
  }

  // Patrol-pick mode: capture two more clicks for pMin/pMax
  if (editorPatrolBot) {
    if (editorPatrolStep === 0) {
      editorPatrolBot.pMin = edSnap(edClampX(mx));
      editorPatrolStep = 1;
    } else {
      editorPatrolBot.pMax = edSnap(edClampX(mx));
      // Auto-swap if reversed
      if (editorPatrolBot.pMax < editorPatrolBot.pMin) {
        const t = editorPatrolBot.pMin; editorPatrolBot.pMin = editorPatrolBot.pMax; editorPatrolBot.pMax = t;
      }
      editorPatrolBot = null;
      editorPatrolStep = 0;
      editorDirty = true;
      saveEditorDraft();
    }
    return;
  }

  const t = editorTool;
  const x = edSnap(edClampX(mx));
  const y = edSnap(edClampY(my));

  if (t === 'select') {
    const hit = edHitTest(mx, my);
    editorSelection = hit;
    if (hit) {
      const obj = edGetSelected();
      editorDrag = {
        type: hit.type,
        index: hit.index,
        mode: 'move',
        ox: mx - obj.x, oy: my - obj.y,
        orig: { ...obj },
      };
    }
    return;
  }

  if (t === 'platform') {
    editorDragStart = { x, y };
    editorDrag = { type: 'newPlatform', ox: x, oy: y };
    return;
  }
  if (t === 'sprout' || t === 'floater' || t === 'charger') {
    const newBot = { kind: t, x, y, pMin: x - 40, pMax: x + 40, speed: t === 'floater' ? 1.4 : 1.3 };
    editorLevel.bots.push(newBot);
    editorPatrolBot = newBot;
    editorPatrolStep = 0;
    editorSelection = { type: 'bot', index: editorLevel.bots.length - 1 };
    editorDirty = true;
    saveEditorDraft();
    return;
  }
  if (t === 'sentry') {
    editorLevel.bots.push({ kind: 'sentry', x, y, interval: 90 });
    editorSelection = { type: 'bot', index: editorLevel.bots.length - 1 };
    editorDirty = true;
    saveEditorDraft();
    return;
  }
  if (t === 'spawn') {
    editorLevel.spawn = { x, y };
    editorSelection = { type: 'spawn' };
    editorDirty = true;
    saveEditorDraft();
    return;
  }
  if (t === 'goal') {
    editorLevel.goal = { x, y, w: 24, h: 60 };
    editorSelection = { type: 'goal' };
    editorDirty = true;
    saveEditorDraft();
    return;
  }
  if (t === 'baba') {
    editorLevel.babaRule = { x, y };
    editorSelection = { type: 'baba' };
    editorDirty = true;
    saveEditorDraft();
    return;
  }
  if (t === 'boss') {
    editorLevel.boss = { x: x - 40, y: y - 90, w: 80, h: 90, hp: 4 };
    editorSelection = { type: 'boss' };
    editorDirty = true;
    saveEditorDraft();
    return;
  }
  if (t === 'delete') {
    const hit = edHitTest(mx, my);
    if (!hit) return;
    if (hit.type === 'platform')      editorLevel.platforms.splice(hit.index, 1);
    else if (hit.type === 'bot')      editorLevel.bots.splice(hit.index, 1);
    else if (hit.type === 'goal')     editorLevel.goal = null;
    else if (hit.type === 'baba')     editorLevel.babaRule = null;
    else if (hit.type === 'boss')     editorLevel.boss = null;
    // spawn is a singleton — refuse to delete
    editorSelection = null;
    editorDirty = true;
    saveEditorDraft();
    return;
  }
}

function editorMouseMove(mx, my) {
  if (!editorDrag) return;
  if (editorDrag.type === 'newPlatform') {
    // live size handled by drawEditorPlacement
    return;
  }
  if (editorDrag.mode === 'move') {
    const obj = edGetSelected();
    if (!obj) return;
    const nx = edSnap(edClampX(mx - editorDrag.ox));
    const ny = edSnap(edClampY(my - editorDrag.oy));
    if (editorDrag.type === 'spawn' || editorDrag.type === 'baba') {
      obj.x = nx; obj.y = ny;
    } else {
      obj.x = nx; obj.y = ny;
    }
    editorDirty = true;
  }
}

function editorMouseUp(mx, my) {
  if (!editorDrag) return;
  if (editorDrag.type === 'newPlatform') {
    const x0 = editorDrag.ox, y0 = editorDrag.oy;
    const x1 = edSnap(edClampX(mx)), y1 = edSnap(edClampY(my));
    const x = Math.min(x0, x1), y = Math.min(y0, y1);
    const w = Math.max(8,  Math.abs(x1 - x0));
    const h = Math.max(8,  Math.abs(y1 - y0));
    editorLevel.platforms.push({ x, y, w, h });
    editorSelection = { type: 'platform', index: editorLevel.platforms.length - 1 };
    editorDirty = true;
    saveEditorDraft();
  } else {
    saveEditorDraft();
  }
  editorDrag = null;
}

function editorToolbarClick(mx, my) {
  // Tool buttons first
  const btnW = 30, btnH = 28, btnY = 6, gap = 2;
  let bx = 6;
  for (const t of ED_TOOLS) {
    if (mx >= bx && mx <= bx + btnW && my >= btnY && my <= btnY + btnH) {
      editorTool = t.id;
      editorSelection = null;
      editorPatrolBot = null;
      return;
    }
    bx += btnW + gap;
  }
  bx += 8;
  // THEME button (cycles)
  if (mx >= bx && mx <= bx + 70 && my >= btnY && my <= btnY + btnH) {
    editorCycleTheme();
    return;
  }
  bx += 70 + 6;
  // PLAY
  if (mx >= bx && mx <= bx + 60 && my >= btnY && my <= btnY + btnH) {
    editorTestPlay();
    return;
  }
  bx += 60 + 6;
  // SHARE
  if (mx >= bx && mx <= bx + 60 && my >= btnY && my <= btnY + btnH) {
    editorShare();
    return;
  }
  bx += 60 + 6;
  // IMPORT
  if (mx >= bx && mx <= bx + 60 && my >= btnY && my <= btnY + btnH) {
    editorImport();
    return;
  }
  bx += 60 + 6;
  // EXIT
  if (mx >= bx && mx <= bx + 50 && my >= btnY && my <= btnY + btnH) {
    saveEditorDraft();
    gameState = 'menu';
    menuCursor = 0;
    return;
  }
}

function editorCycleTheme() {
  const themes = Object.keys(THEME_SKY);
  const i = themes.indexOf(editorLevel.theme);
  editorLevel.theme = themes[(i + 1) % themes.length];
  currentTheme = editorLevel.theme;
  editorDirty = true;
  saveEditorDraft();
}

function editorTestPlay() {
  if (!editorLevel.spawn || !editorLevel.goal && !editorLevel.boss) {
    editorToast('need a SPAWN and a GOAL or BOSS');
    return;
  }
  saveEditorDraft();
  loadCustomLevel(editorLevel, { fromEditor: true });
  gameState = 'playing';
}

function editorShare() {
  const enc = encodeShareString(editorLevel);
  const url = `${location.origin}${location.pathname}#lvl=${enc}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(
      () => editorToast('link copied! paste to share'),
      () => editorToast('copy failed — see console'),
    );
    console.log('share URL:', url);
  } else {
    editorToast('clipboard unavailable — URL in console');
    console.log('share URL:', url);
  }
}

function editorImport() {
  const input = window.prompt('paste a share link or code:');
  if (!input) return;
  let code = input.trim();
  const idx = code.indexOf('#lvl=');
  if (idx >= 0) code = code.slice(idx + 5);
  const ed = decodeShareString(code);
  if (!ed) { editorToast('invalid link'); return; }
  editorLevel = ed;
  editorSelection = null;
  editorPatrolBot = null;
  currentTheme = editorLevel.theme;
  editorDirty = true;
  saveEditorDraft();
  editorToast('imported');
}

function editorInspectorClick(mx, my) {
  const sel = edGetSelected();
  if (!sel) return;
  // Each row in the inspector is 24px tall; 5 rows of +/- pairs
  // Layout: label at top, then +/- on the right of each row
  const ix = W - ED_INSP_W + 10;
  const startY = ED_TOOLBAR_H + 36;
  const rowH = 22;

  const fields = editorInspectorFields();
  for (let i = 0; i < fields.length; i++) {
    const fy = startY + i * rowH;
    if (my < fy || my > fy + rowH - 2) continue;
    const minusX = W - 70, plusX = W - 32, btnSize = 22;
    if (mx >= minusX && mx <= minusX + btnSize && my >= fy && my <= fy + btnSize) {
      fields[i].set(fields[i].get() - fields[i].step);
      editorDirty = true; saveEditorDraft();
      return;
    }
    if (mx >= plusX && mx <= plusX + btnSize && my >= fy && my <= fy + btnSize) {
      fields[i].set(fields[i].get() + fields[i].step);
      editorDirty = true; saveEditorDraft();
      return;
    }
  }
}

// Per-selection editable fields. Returns array of {label, get, set, step}.
function editorInspectorFields() {
  const sel = edGetSelected();
  if (!sel) return [];
  const out = [];
  if (editorSelection.type === 'platform') {
    out.push({ label: 'X', get: () => sel.x, set: (v) => sel.x = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'Y', get: () => sel.y, set: (v) => sel.y = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'W', get: () => sel.w, set: (v) => sel.w = Math.max(8, edSnap(v)), step: 8 });
    out.push({ label: 'H', get: () => sel.h, set: (v) => sel.h = Math.max(8, edSnap(v)), step: 8 });
  } else if (editorSelection.type === 'bot') {
    out.push({ label: 'X', get: () => sel.x, set: (v) => sel.x = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'Y', get: () => sel.y, set: (v) => sel.y = Math.max(0, edSnap(v)), step: 8 });
    if (sel.kind === 'sentry') {
      out.push({ label: 'INTERVAL', get: () => sel.interval, set: (v) => sel.interval = Math.max(20, Math.round(v)), step: 10 });
    } else {
      out.push({ label: 'PMIN', get: () => sel.pMin, set: (v) => sel.pMin = Math.max(0, edSnap(v)), step: 8 });
      out.push({ label: 'PMAX', get: () => sel.pMax, set: (v) => sel.pMax = Math.max(sel.pMin + 8, edSnap(v)), step: 8 });
      out.push({ label: 'SPEED×10', get: () => Math.round(sel.speed * 10), set: (v) => sel.speed = Math.max(0.2, v / 10), step: 1 });
    }
  } else if (editorSelection.type === 'goal') {
    out.push({ label: 'X', get: () => sel.x, set: (v) => sel.x = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'Y', get: () => sel.y, set: (v) => sel.y = Math.max(0, edSnap(v)), step: 8 });
  } else if (editorSelection.type === 'boss') {
    out.push({ label: 'X', get: () => sel.x, set: (v) => sel.x = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'Y', get: () => sel.y, set: (v) => sel.y = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'HP', get: () => sel.hp, set: (v) => sel.hp = Math.max(1, Math.round(v)), step: 1 });
  } else if (editorSelection.type === 'spawn' || editorSelection.type === 'baba') {
    out.push({ label: 'X', get: () => sel.x, set: (v) => sel.x = Math.max(0, edSnap(v)), step: 8 });
    out.push({ label: 'Y', get: () => sel.y, set: (v) => sel.y = Math.max(0, edSnap(v)), step: 8 });
  }
  return out;
}

function drawEditor() {
  // Live preview using the existing render pipeline against editorLevel
  const savedTheme = currentTheme;
  currentTheme = editorLevel.theme;

  drawSky();
  // Draw editor's babaRule like normal so it's visible/editable
  const savedBaba = babaRule; babaRule = editorLevel.babaRule;
  drawBabaRule();
  babaRule = savedBaba;
  for (const p of editorLevel.platforms) drawPlatform(p);
  // Goal
  if (editorLevel.goal) {
    const sg = goal; goal = editorLevel.goal; drawGoal(); goal = sg;
  }
  // Boss (just the body, no AI state)
  if (editorLevel.boss) {
    const sb = boss;
    boss = { ...editorLevel.boss, maxHp: editorLevel.boss.hp, state: 'vulnerable', stateTimer: 1000, projTimer: 1000, isFinal: false };
    drawBoss();
    boss = sb;
  }
  // Bots
  for (const b of editorLevel.bots) {
    const runtime = inflateBot(b);
    if (!runtime) continue;
    runtime.stunTimer = 0;
    const savedBots = bots; bots = [runtime];
    drawBot(runtime);
    bots = savedBots;
  }
  // Spawn marker
  if (editorLevel.spawn) {
    const sx = editorLevel.spawn.x, sy = editorLevel.spawn.y;
    ctx.fillStyle = 'rgba(120, 255, 180, 0.6)';
    ctx.fillRect(sx - 14, sy - 18, 28, 40);
    ctx.fillStyle = '#fff';
    ctx.font = '700 9px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SPAWN', sx, sy - 4);
    ctx.textAlign = 'left';
  }

  // Grid overlay (only if zoomed or just visible faintly)
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let gx = 0; gx < W; gx += 32) ctx.fillRect(gx, ED_TOOLBAR_H, 1, H - ED_TOOLBAR_H);
  for (let gy = ED_TOOLBAR_H; gy < H; gy += 32) ctx.fillRect(0, gy, W, 1);

  // Selection halo
  if (editorSelection) {
    drawEditorSelection();
  }

  // Patrol-pick ghost
  if (editorPatrolBot) {
    const b = editorPatrolBot;
    const midY = b.y + (b.kind === 'floater' ? 14 : 13);
    ctx.fillStyle = '#66ff88';
    if (editorPatrolStep === 0) {
      ctx.fillRect(mouseX - 1, midY - 6, 2, 12);
      ctx.font = '700 11px -apple-system, sans-serif';
      ctx.fillText('click for PMIN', mouseX + 8, midY - 2);
    } else {
      // pMin already set; show range so far
      ctx.fillRect(b.pMin, midY - 1, Math.max(2, mouseX - b.pMin), 2);
      ctx.fillRect(b.pMin - 1, midY - 6, 2, 12);
      ctx.fillRect(mouseX - 1, midY - 6, 2, 12);
      ctx.font = '700 11px -apple-system, sans-serif';
      ctx.fillText('click for PMAX', mouseX + 8, midY - 2);
    }
  }

  // Placement ghost — new platform drag
  if (editorDrag && editorDrag.type === 'newPlatform') {
    const x0 = editorDrag.ox, y0 = editorDrag.oy;
    const x1 = edSnap(edClampX(mouseX)), y1 = edSnap(edClampY(mouseY));
    const gx = Math.min(x0, x1), gy = Math.min(y0, y1);
    const gw = Math.max(8, Math.abs(x1 - x0)), gh = Math.max(8, Math.abs(y1 - y0));
    ctx.fillStyle = 'rgba(120, 255, 180, 0.4)';
    ctx.fillRect(gx, gy, gw, gh);
    ctx.fillStyle = '#66ff88';
    ctx.font = '700 11px -apple-system, sans-serif';
    ctx.fillText(`${gw} × ${gh}`, gx, gy - 4);
  }

  currentTheme = savedTheme;

  drawEditorToolbar();
  if (editorSelection) drawEditorInspector();
  drawEditorToast();
}

function drawEditorSelection() {
  const obj = edGetSelected();
  if (!obj) return;
  let x = obj.x, y = obj.y, w = 0, h = 0;
  if (editorSelection.type === 'platform' || editorSelection.type === 'goal' || editorSelection.type === 'boss') {
    w = obj.w; h = obj.h;
  } else if (editorSelection.type === 'bot') {
    w = obj.kind === 'floater' ? 32 : 30;
    h = obj.kind === 'floater' ? 28 : 26;
  } else if (editorSelection.type === 'spawn') {
    x = obj.x - 14; y = obj.y - 18; w = 28; h = 40;
  } else if (editorSelection.type === 'baba') {
    w = 168; h = 50;
  }
  ctx.strokeStyle = '#66ff88';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
  // Patrol-range overlay for bots
  if (editorSelection.type === 'bot' && obj.kind !== 'sentry') {
    const midY = obj.y + h / 2;
    ctx.fillStyle = 'rgba(120, 255, 180, 0.45)';
    ctx.fillRect(obj.pMin, midY - 1, obj.pMax - obj.pMin, 2);
    ctx.fillRect(obj.pMin - 1, midY - 5, 2, 10);
    ctx.fillRect(obj.pMax - 1, midY - 5, 2, 10);
  }
}

function drawEditorToolbar() {
  // Background bar
  ctx.fillStyle = 'rgba(10, 10, 25, 0.85)';
  ctx.fillRect(0, 0, W, ED_TOOLBAR_H);
  ctx.fillStyle = '#444';
  ctx.fillRect(0, ED_TOOLBAR_H - 1, W, 1);

  // Tool buttons
  const btnW = 30, btnH = 28, btnY = 6, gap = 2;
  let bx = 6;
  for (const t of ED_TOOLS) {
    const active = editorTool === t.id;
    ctx.fillStyle = active ? '#ffdd33' : 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, btnY, btnW, btnH);
    ctx.fillStyle = active ? '#000' : '#fff';
    ctx.font = '700 10px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.hotkey, bx + btnW / 2, btnY + 12);
    ctx.font = '500 7px -apple-system, sans-serif';
    ctx.fillText(t.label.slice(0, 4), bx + btnW / 2, btnY + 22);
    bx += btnW + gap;
  }
  bx += 8;
  // Theme
  const themeName = editorLevel.theme.toUpperCase();
  ctx.fillStyle = THEME_PLAT[editorLevel.theme].top;
  ctx.fillRect(bx, btnY, 70, btnH);
  ctx.fillStyle = '#000';
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.fillText(themeName, bx + 35, btnY + 18);
  bx += 70 + 6;
  // PLAY
  ctx.fillStyle = '#66ff88';
  ctx.fillRect(bx, btnY, 60, btnH);
  ctx.fillStyle = '#000';
  ctx.font = '800 13px -apple-system, sans-serif';
  ctx.fillText('PLAY', bx + 30, btnY + 19);
  bx += 60 + 6;
  // SHARE
  ctx.fillStyle = '#7ecbff';
  ctx.fillRect(bx, btnY, 60, btnH);
  ctx.fillStyle = '#000';
  ctx.fillText('SHARE', bx + 30, btnY + 19);
  bx += 60 + 6;
  // IMPORT
  ctx.fillStyle = '#ffaa44';
  ctx.fillRect(bx, btnY, 60, btnH);
  ctx.fillText('IMPORT', bx + 30, btnY + 19);
  bx += 60 + 6;
  // EXIT
  ctx.fillStyle = 'rgba(255, 100, 100, 0.7)';
  ctx.fillRect(bx, btnY, 50, btnH);
  ctx.fillStyle = '#fff';
  ctx.fillText('EXIT', bx + 25, btnY + 19);
  ctx.textAlign = 'left';
}

function drawEditorInspector() {
  const x = W - ED_INSP_W;
  ctx.fillStyle = 'rgba(10, 10, 25, 0.85)';
  ctx.fillRect(x, ED_TOOLBAR_H, ED_INSP_W, H - ED_TOOLBAR_H);
  ctx.fillStyle = '#444';
  ctx.fillRect(x, ED_TOOLBAR_H, 1, H - ED_TOOLBAR_H);

  ctx.fillStyle = '#ffdd33';
  ctx.font = '700 12px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  const title = editorSelection.type === 'bot'
    ? edGetSelected()?.kind?.toUpperCase() || 'BOT'
    : editorSelection.type.toUpperCase();
  ctx.fillText(title, x + 10, ED_TOOLBAR_H + 22);

  const fields = editorInspectorFields();
  const startY = ED_TOOLBAR_H + 36;
  const rowH = 22;
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i];
    const fy = startY + i * rowH;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '600 10px -apple-system, sans-serif';
    ctx.fillText(f.label, x + 10, fy + 14);
    ctx.fillStyle = '#fff';
    ctx.font = '700 11px "SF Mono", Menlo, monospace';
    ctx.fillText(String(f.get()), x + 50, fy + 14);
    // - +
    const minusX = W - 70, plusX = W - 32, btnSize = 22;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(minusX, fy, btnSize, btnSize);
    ctx.fillRect(plusX,  fy, btnSize, btnSize);
    ctx.fillStyle = '#fff';
    ctx.font = '800 14px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('−', minusX + btnSize / 2, fy + 16);
    ctx.fillText('+', plusX + btnSize / 2, fy + 16);
    ctx.textAlign = 'left';
  }
}

function drawEditorToast() {
  if (editorToastMs <= 0) return;
  editorToastMs--;
  const alpha = Math.min(1, editorToastMs / 20);
  const w = ctx.measureText(editorToastText).width + 24;
  const x = (W - w) / 2;
  const y = H - 40;
  ctx.fillStyle = `rgba(0, 0, 0, ${0.8 * alpha})`;
  ctx.fillRect(x, y, w, 28);
  ctx.fillStyle = `rgba(255, 221, 51, ${alpha})`;
  ctx.font = '700 13px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(editorToastText, W / 2, y + 18);
  ctx.textAlign = 'left';
}

function drawLevelSelect() {
  // Background — themed to currently selected level
  const lv = LEVELS[selectCursor];
  const savedTheme = currentTheme;
  currentTheme = lv.theme || 'field';
  drawSky();
  currentTheme = savedTheme;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  clickables = [];
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffdd33';
  ctx.font = '800 32px -apple-system, sans-serif';
  ctx.fillText('LEVEL SELECT', W / 2, 50);

  // Grid
  const cellW = 80, cellH = 50, gapX = 12, gapY = 12;
  const gridW = LEVEL_SELECT_COLS * cellW + (LEVEL_SELECT_COLS - 1) * gapX;
  const gridH = LEVEL_SELECT_ROWS * cellH + (LEVEL_SELECT_ROWS - 1) * gapY;
  const startX = (W - gridW) / 2;
  const startY = 78;

  for (let i = 0; i < LEVELS.length; i++) {
    const row = Math.floor(i / LEVEL_SELECT_COLS);
    const col = i % LEVEL_SELECT_COLS;
    const x = startX + col * (cellW + gapX);
    const y = startY + row * (cellH + gapY);
    const lvi = LEVELS[i];
    const isBoss = !!lvi.boss;
    const hovered = mouseX >= x && mouseX <= x + cellW && mouseY >= y && mouseY <= y + cellH;
    if (hovered) selectCursor = i;
    const selected = i === selectCursor;

    ctx.fillStyle = selected ? 'rgba(255, 221, 51, 0.25)'
                  : isBoss ? 'rgba(180, 40, 40, 0.30)'
                  : 'rgba(255, 255, 255, 0.10)';
    ctx.fillRect(x, y, cellW, cellH);
    ctx.fillStyle = selected ? '#ffdd33'
                   : isBoss  ? '#ff6644'
                   : 'rgba(255,255,255,0.45)';
    ctx.fillRect(x, y, cellW, 2);
    ctx.fillRect(x, y + cellH - 2, cellW, 2);
    ctx.fillRect(x, y, 2, cellH);
    ctx.fillRect(x + cellW - 2, y, 2, cellH);
    // Number
    ctx.fillStyle = selected ? '#ffdd33' : '#fff';
    ctx.font = '800 18px -apple-system, sans-serif';
    ctx.fillText(String(i + 1), x + cellW / 2, y + 22);
    // Name (smaller)
    ctx.font = '600 10px -apple-system, sans-serif';
    ctx.fillStyle = selected ? '#ffdd33' : 'rgba(255,255,255,0.7)';
    ctx.fillText(lvi.name, x + cellW / 2, y + 38);

    clickables.push({
      x, y, w: cellW, h: cellH,
      action: () => { selectCursor = i; loadLevel(i); gameState = 'playing'; },
    });
  }

  // Footer info
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '500 12px -apple-system, sans-serif';
  ctx.fillText('arrows + Enter · or click a level · Esc to return', W / 2, H - 18);
  ctx.textAlign = 'left';
}

// Touch / mouse controls for mobile
function bindTouchButton(id, onPress, onRelease) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => { e.preventDefault(); onPress(); };
  const release = (e) => { e.preventDefault(); onRelease(); };
  el.addEventListener('touchstart', press,   { passive: false });
  el.addEventListener('touchend',   release, { passive: false });
  el.addEventListener('touchcancel',release, { passive: false });
  el.addEventListener('mousedown',  press);
  el.addEventListener('mouseup',    release);
  el.addEventListener('mouseleave', release);
}

bindTouchButton('btn-left',
  () => { keys['KeyA'] = true; },
  () => { keys['KeyA'] = false; });
bindTouchButton('btn-right',
  () => { keys['KeyD'] = true; },
  () => { keys['KeyD'] = false; });
bindTouchButton('btn-jump',
  () => { jumpQueued = true; advanceQueued = true; keys['KeyW'] = true; },
  () => { keys['KeyW'] = false; });
bindTouchButton('btn-dash',
  () => { dashQueued = true; keys['KeyJ'] = true; },
  () => { keys['KeyJ'] = false; });

const SAVE_KEY = 'platformer.currentLevel';

function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, String(currentLevel)); } catch (e) {}
}

function loadSavedLevel() {
  try {
    const v = localStorage.getItem(SAVE_KEY);
    const n = parseInt(v, 10);
    if (!isNaN(n) && n >= 0 && n < LEVELS.length) return n;
  } catch (e) {}
  return 0;
}

// Shared init path used by both built-in level loads (loadLevel) and custom
// level loads (loadCustomLevel). Takes a runtime-form level object.
function initFromLevelObject(lv) {
  spawn = { x: lv.spawn.x, y: lv.spawn.y };
  platforms = lv.platforms.map((p) => ({ ...p }));
  bots = lv.bots.map((b) => ({ ...b, stunTimer: 0 }));
  goal = lv.goal ? { ...lv.goal } : null;
  babaRule = lv.babaRule ? { ...lv.babaRule } : { x: 310, y: 70 };
  currentTheme = lv.theme || 'field';
  projectiles = [];
  boss = lv.boss ? {
    ...lv.boss,
    isFinal: !!lv.boss.isFinal,
    maxHp: lv.boss.hp,
    state: 'vulnerable',
    stateTimer: BOSS_VULN_FRAMES,
    projTimer: 0,
  } : null;
  levelComplete = false;
  levelCompleteTimer = 0;
  respawn();
}

function loadLevel(idx) {
  const lv = LEVELS[idx];
  const prevWorld = Math.floor(currentLevel / 3);
  const newWorld = Math.floor(idx / 3);
  // Cross-world lives refill is suppressed during a trial so range/full runs
  // can't pad themselves with free hearts every 3 levels.
  if (prevWorld !== newWorld && !timeTrial) livesLeft = LIVES_PER_WORLD;
  customLevelActive = null;
  currentLevel = idx;
  levelName = lv.name;
  if (!timeTrial) saveProgress();
  initFromLevelObject(lv);
}

// Load an editor-form custom level. fromEditor=true means we'll route back to
// the editor on exit (death after lives, goal touch, Esc-quit).
function loadCustomLevel(editorForm, opts = {}) {
  const runtime = levelToRuntime(editorForm);
  // Force-strip isFinal on custom levels so they can't trigger the canonical
  // end-of-game flow.
  if (runtime.boss) runtime.boss.isFinal = false;
  customLevelActive = { editor: editorForm, runtime, fromEditor: !!opts.fromEditor };
  returnToEditorOnExit = !!opts.fromEditor;
  // currentLevel sentinel — null prevents arithmetic like LEVELS[currentLevel+1]
  currentLevel = null;
  levelName = editorForm.name || 'Custom';
  livesLeft = LIVES_PER_WORLD;
  initFromLevelObject(runtime);
}

function pressing(...names) {
  return names.some((n) => keys[n]);
}

function update() {
  // Tick the trial timer (frame-stepped so pause naturally stops it)
  if (timeTrial && !timeTrial.finished && !levelComplete) {
    timeTrial.elapsedMs += FRAME_MS;
  }

  if (levelComplete) {
    levelCompleteTimer++;
    // During a trial we already handled the trial-finish/auto-advance in
    // onLevelCleared — suppress the normal advanceQueued flow.
    if (!timeTrial) {
      if (advanceQueued && levelCompleteTimer > 30) {
        advanceQueued = false;
        const next = currentLevel + 1;
        if (next < LEVELS.length) {
          loadLevel(next);
        } else {
          // last level — restart from beginning for now
          loadLevel(0);
        }
      }
    }
    advanceQueued = false;
    jumpQueued = false;
    dashQueued = false;
    return;
  }

  const left  = pressing('KeyA', 'ArrowLeft');
  const right = pressing('KeyD', 'ArrowRight');

  const dashing = player.dashTimer > 0;

  if (!dashing) {
    if (left)  { player.vx -= MOVE_ACCEL; player.facing = -1; }
    if (right) { player.vx += MOVE_ACCEL; player.facing =  1; }

    player.vx *= FRICTION;
    if (Math.abs(player.vx) < 0.05) player.vx = 0;
    // Speed cap is relaxed while super-boost is active, so you keep your dash speed for a beat
    if (player.superBoost <= 0) {
      player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));
    } else {
      player.vx = Math.max(-DASH_SPEED, Math.min(DASH_SPEED, player.vx));
    }
  }

  if (jumpQueued) {
    // Super conditions, in priority order:
    //   1. Mid-dash + (dash started on ground OR konami unlocked) → standard super
    //   2. Inside a super already, near its tail → chain another super
    //   3. Just finished a super, within the late-super coyote window → still super
    const superAllowed = dashing && (player.dashFromGround || konamiUnlocked);
    const tailOfSuper  = player.superBoost > 0 && player.superBoost <= LATE_SUPER_FRAMES;
    const lateSuper    = player.lateSuperTimer > 0;

    if (superAllowed) {
      player.dashTimer = 0;
      player.vy = -JUMP_POWER;
      player.vx = DASH_SPEED * player.dashDir;
      player.superBoost = SUPER_BOOST_FRAMES;
      player.onGround = false;
      audio.super();
    } else if (tailOfSuper || lateSuper) {
      // Chain / coyote super — also refund a midair dash + clear cooldown so
      // the next dash fires immediately instead of being blocked by leftover
      // cooldown from the original ground dash.
      player.vy = -JUMP_POWER;
      player.vx = DASH_SPEED * player.dashDir;
      player.superBoost = SUPER_BOOST_FRAMES;
      player.lateSuperTimer = 0;
      player.dashAvailable = true;
      player.dashCooldown = 0;
      player.onGround = false;
      audio.super();
    } else if (player.onGround) {
      player.vy = -JUMP_POWER;
      player.onGround = false;
      audio.jump();
    }
  }
  jumpQueued = false;

  // Super tick — open the late-super coyote window the moment the super ends
  if (player.superBoost > 0) {
    player.superBoost--;
    if (player.superBoost === 0) player.lateSuperTimer = LATE_SUPER_FRAMES;
  } else if (player.lateSuperTimer > 0) {
    player.lateSuperTimer--;
  }

  // Dash gate: cooldown is the time limiter; ground-touch is the count limiter
  // (one dash per landing). Konami unlock removes the ground-touch gate.
  const dashGateOk = player.dashCooldown <= 0 && (konamiUnlocked || player.dashAvailable);
  if (dashQueued && dashGateOk) {
    player.dashTimer = DASH_DURATION;
    player.dashCooldown = DASH_COOLDOWN;
    player.dashDir = player.facing;
    player.dashFromGround = player.onGround;
    player.dashAvailable = false; // consumed until next ground touch
    player.vy = 0;
    audio.dash();
  }
  dashQueued = false;

  if (player.dashTimer > 0) {
    player.vx = DASH_SPEED * player.dashDir;
    player.vy = 0;
    player.dashTimer--;
  } else {
    player.vy += GRAVITY;
  }
  if (player.dashCooldown > 0) player.dashCooldown--;

  const wasOnGround = player.onGround;
  player.x += player.vx;
  resolveX();
  player.y += player.vy;
  player.onGround = false;
  resolveY();
  // Refund the dash on landing: one dash per ground touch
  if (!wasOnGround && player.onGround) {
    player.dashAvailable = true;
  }

  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > W) { player.x = W - player.w; player.vx = 0; }
  if (player.y > H + 200) {
    // Falling off = death. Mark hearts to 0 so the deferred death check at the
    // end of update() handles the actual world-reset cleanly.
    player.hearts = 0;
  }

  updateBots();
  handleBotCollisions();
  updateBoss();
  handleBossCollision();
  updateProjectiles();

  if (player.invulnTimer > 0) player.invulnTimer--;

  if (goal && overlap(player, goal)) {
    if (!levelComplete) {
      audio.winLevel();
      if (timeTrial) {
        onLevelCleared();
        return; // trial took over — don't fall through to setting levelComplete
      }
      if (customLevelActive) {
        // Test-play / custom-level success — bounce back to editor (or menu)
        const ret = returnToEditorOnExit;
        customLevelActive = null;
        returnToEditorOnExit = false;
        if (ret) { editorToast('LEVEL CLEAR ✓'); gameState = 'editor'; }
        else     { gameState = 'menu'; menuCursor = 0; }
        return;
      }
    }
    levelComplete = true;
    levelCompleteTimer = 0;
    advanceQueued = false;
  }

  // Deferred death: handle at the end of the tick so nothing mutates state
  // (clears projectiles, switches level) while another loop is iterating.
  if (player.hearts <= 0) die();
}

function updateBots() {
  for (const b of bots) {
    if (b.stunTimer > 0) {
      b.stunTimer--;
      continue;
    }

    if (b.type === 'sentry') {
      b.shootTimer--;
      if (b.shootTimer <= 0) {
        spawnEnemyProjectile(b);
        b.shootTimer = b.shootInterval;
      }
      continue;
    }

    if (b.type === 'charger') {
      // Same-floor detection: both feet at the same y means same surface
      const sameY = Math.abs((player.y + player.h) - (b.y + b.h)) < 5;
      const dist  = Math.abs((player.x + player.w / 2) - (b.x + b.w / 2));
      if (sameY && dist < 250) {
        b.charging = true;
        b.vx = (player.x > b.x ? 1 : -1) * b.chargeSpeed;
      } else if (!sameY || dist > 350) {
        b.charging = false;
        if (Math.abs(b.vx) > b.speed) b.vx = Math.sign(b.vx) * b.speed || b.speed;
      }
      b.x += b.vx;
      if (b.x < b.patrolMin)       { b.x = b.patrolMin;       b.vx =  Math.abs(b.vx); }
      if (b.x + b.w > b.patrolMax) { b.x = b.patrolMax - b.w; b.vx = -Math.abs(b.vx); }
      continue;
    }

    // sprout / floater: simple horizontal patrol
    b.x += b.vx;
    if (b.x < b.patrolMin)         { b.x = b.patrolMin;          b.vx =  b.speed; }
    if (b.x + b.w > b.patrolMax)   { b.x = b.patrolMax - b.w;    b.vx = -b.speed; }
  }
}

function spawnEnemyProjectile(b) {
  const dir = (player.x + player.w / 2) > (b.x + b.w / 2) ? 1 : -1;
  projectiles.push({
    x: dir > 0 ? b.x + b.w : b.x - 10,
    y: b.y + b.h / 2 - 4,
    w: 10, h: 8,
    vx: dir * 4.5,
    enemy: true,
  });
  audio.bossShot();
}

function handleBotCollisions() {
  const dashing = player.dashTimer > 0;
  const supering = player.superBoost > 0;

  // Dashing OR supering into an un-stunned bot stuns it.
  // Plain dash also auto-mounts the player on top. A super preserves trajectory.
  if (dashing || supering) {
    for (const b of bots) {
      if (b.stunTimer > 0) continue;
      if (overlap(player, b)) {
        b.stunTimer = STUN_DURATION;
        b.vx = 0;
        if (dashing) {
          // auto-mount: snap onto bot's top
          player.y = b.y - player.h;
          player.vy = 0;
          player.vx = 0;
          player.dashTimer = 0;
          player.onGround = true;
          player.dashAvailable = true; // landing on a stunned bot counts as ground touch
        }
        audio.stunHit();
        return;
      }
    }
  }

  // Touching an un-stunned bot (not attacking, not invulnerable) hurts.
  if (dashing || supering) return;
  if (player.invulnTimer > 0) return;
  for (const b of bots) {
    if (b.stunTimer > 0) continue;
    if (overlap(player, b)) {
      hurtPlayer(b);
      return;
    }
  }
}

function hurtPlayer(source) {
  player.hearts--;
  player.invulnTimer = INVULN_FRAMES;
  const dir = (player.x + player.w / 2) < (source.x + source.w / 2) ? -1 : 1;
  player.vx = HURT_KNOCKBACK_X * dir;
  player.vy = HURT_KNOCKBACK_Y;
  if (player.hearts > 0) audio.hurt();
  // Death sound is played from die() itself.
  // Don't respawn here — it would clear projectiles[] mid-iteration upstream.
  // The respawn check happens at the end of update().
}

function respawn() {
  player.x = spawn.x;
  player.y = spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.dashTimer = 0;
  player.dashCooldown = 0;
  player.dashFromGround = false;
  player.dashAvailable = true;
  player.lateSuperTimer = 0;
  player.superBoost = 0;
  player.hearts = MAX_HEARTS;
  player.invulnTimer = 0;
  player.facing = 1;

  // Reset boss + clear projectiles
  projectiles = [];
  if (boss) {
    const lvDef = LEVELS[currentLevel];
    if (lvDef.boss) {
      boss.hp = lvDef.boss.hp;
      boss.state = 'vulnerable';
      boss.stateTimer = BOSS_VULN_FRAMES;
      boss.projTimer = 0;
    }
  }
}

// Death uses up a life. With lives left, you respawn at the SAME level you
// died on. When you run out of lives, the whole world restarts at its first
// level and your life counter refills.
//
// Inside a time trial: each death increments the death counter and respawns
// on the same level (lives are effectively shared across the run). Out of
// lives ends the trial as DNF.
function die() {
  audio.die();
  if (timeTrial) {
    timeTrial.deaths++;
    livesLeft--;
    if (livesLeft <= 0) {
      // Trial DNF — no PB written
      endTrial(true);
      return;
    }
    loadLevel(currentLevel);
    return;
  }
  if (customLevelActive) {
    // Custom levels don't restart from a "world first" — they're one-offs.
    // Lives still tick; running out boots you back to the editor (or menu).
    livesLeft--;
    if (livesLeft <= 0) {
      livesLeft = LIVES_PER_WORLD;
      const ret = returnToEditorOnExit;
      customLevelActive = null;
      returnToEditorOnExit = false;
      gameState = ret ? 'editor' : 'menu';
      if (!ret) menuCursor = 0;
      return;
    }
    loadCustomLevel(customLevelActive.editor, { fromEditor: returnToEditorOnExit });
    return;
  }
  livesLeft--;
  if (livesLeft <= 0) {
    livesLeft = LIVES_PER_WORLD;
    const worldFirst = Math.floor(currentLevel / 3) * 3;
    loadLevel(worldFirst);
  } else {
    loadLevel(currentLevel);
  }
}

// ─────────── Trial control ───────────
function formatMs(ms) {
  if (ms == null) return '—';
  const cs    = Math.floor(ms / 10) % 100;
  const sec   = Math.floor(ms / 1000) % 60;
  const min   = Math.floor(ms / 60000) % 60;
  const hours = Math.floor(ms / 3600000);
  const pad2  = (n) => n.toString().padStart(2, '0');
  if (hours > 0) return `${hours}:${pad2(min)}:${pad2(sec)}.${pad2(cs)}`;
  return `${pad2(min)}:${pad2(sec)}.${pad2(cs)}`;
}

function startTrial(type, startIdx, endIdx) {
  timeTrial = {
    type,
    startIdx,
    endIdx,
    elapsedMs: 0,
    splits: [],
    deaths: 0,
    finished: false,
    dnf: false,
    newBest: false,
    konamiActive: konamiUnlocked,
  };
  livesLeft = LIVES_PER_WORLD;
  jumpQueued = false;
  dashQueued = false;
  advanceQueued = false;
  levelComplete = false;
  levelCompleteTimer = 0;
  loadLevel(startIdx);
  gameState = 'playing';
}

// Called when a level is cleared (goal flag OR boss defeat). Returns true if
// the trial logic took over the level-complete behavior (suppresses the
// normal "press SPACE to continue" overlay).
function onLevelCleared() {
  if (!timeTrial || timeTrial.finished) return false;
  // Capture this level's split
  timeTrial.splits.push({ level: currentLevel, ms: timeTrial.elapsedMs });
  if (currentLevel >= timeTrial.endIdx) {
    timeTrial.finished = true;
    finalizeTrialResults();
    gameState = 'trialResults';
    trialResultsCursor = 0;
    return true;
  }
  // Auto-advance to next level on the next frame
  loadLevel(currentLevel + 1);
  return true;
}

function finalizeTrialResults() {
  if (!timeTrial || timeTrial.dnf) return;
  // PB writes are refused if konami was ever active during the run
  // (captured at start, or toggled on mid-run).
  if (timeTrial.konamiActive || konamiUnlocked) return;
  const finalMs = timeTrial.elapsedMs;
  if (timeTrial.type === 'single' || timeTrial.startIdx === timeTrial.endIdx) {
    // Single-level: update levelPbs[currentLevel]
    const lvIdx = timeTrial.startIdx;
    if (levelPbs[lvIdx] == null || finalMs < levelPbs[lvIdx]) {
      levelPbs[lvIdx] = finalMs;
      saveJson(TT_KEYS.levelPbs, levelPbs);
      timeTrial.newBest = true;
    }
  } else if (timeTrial.type === 'range') {
    const key = `${timeTrial.startIdx}-${timeTrial.endIdx}`;
    const prev = rangePbs[key];
    if (!prev || finalMs < prev.ms) {
      rangePbs[key] = { ms: finalMs, splits: timeTrial.splits.slice(), deaths: timeTrial.deaths };
      saveJson(TT_KEYS.rangePbs, rangePbs);
      timeTrial.newBest = true;
    }
  } else if (timeTrial.type === 'full') {
    if (!fullPb || finalMs < fullPb.ms) {
      fullPb = { ms: finalMs, splits: timeTrial.splits.slice(), deaths: timeTrial.deaths };
      saveJson(TT_KEYS.fullPb, fullPb);
      timeTrial.newBest = true;
    }
  }
  // Also update per-level split PBs (best individual level time from any run)
  let prevMs = 0;
  for (let i = 0; i < timeTrial.splits.length; i++) {
    const sp = timeTrial.splits[i];
    const segMs = sp.ms - prevMs;
    if (levelPbs[sp.level] == null || segMs < levelPbs[sp.level]) {
      levelPbs[sp.level] = segMs;
    }
    prevMs = sp.ms;
  }
  saveJson(TT_KEYS.levelPbs, levelPbs);
}

function endTrial(dnf) {
  if (!timeTrial) return;
  timeTrial.finished = true;
  timeTrial.dnf = !!dnf;
  if (!dnf) finalizeTrialResults();
  gameState = 'trialResults';
  trialResultsCursor = 0;
}

function abortTrial() {
  // Clean exit without writing — used by quit-from-pause
  timeTrial = null;
  livesLeft = LIVES_PER_WORLD;
}

function trialSelectConfirm(idx) {
  if (trialSelectMode === 'single') {
    startTrial('single', idx, idx);
  } else if (trialSelectMode === 'rangeStart') {
    rangePickStart = idx;
    trialSelectMode = 'rangeEnd';
  } else if (trialSelectMode === 'rangeEnd') {
    if (idx >= rangePickStart) {
      startTrial('range', rangePickStart, idx);
    }
  }
}

function trialResultsAction(idx) {
  if (!timeTrial) return;
  if (idx === 0) {
    // RETRY
    const { type, startIdx, endIdx } = timeTrial;
    startTrial(type, startIdx, endIdx);
  } else if (idx === 1) {
    // LEVEL SELECT
    abortTrial();
    gameState = 'levelSelect';
    selectCursor = currentLevel;
  } else {
    // MAIN MENU
    abortTrial();
    gameState = 'menu';
    menuCursor = 0;
  }
}

function getSolids() {
  const solids = platforms.slice();
  for (const b of bots) if (b.stunTimer > 0) solids.push(b);
  if (boss && boss.state === 'stunned') solids.push(boss);
  return solids;
}

function bossTiming(boss) {
  // Final boss: shorter vulnerable window, longer & denser attacks, faster telegraph
  if (boss && boss.isFinal) {
    return {
      vuln: 120,       // 2.0s (was 3.0s)
      tele: 35,        // 0.58s (was 0.83s)
      atk:  180,       // 3.0s (was 2.0s)
      projInterval: 14,// every 0.23s (was 0.33s) — ~13 projectiles per barrage
    };
  }
